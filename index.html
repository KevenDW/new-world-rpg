<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New World RPG</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#ECE8F6; --panel:#FFFFFF; --soft:#F3F0FA; --ink:#1E1B2E; --muted:#5D5776; --line:#1E1B2E; --shadow-c:#1E1B2E;
  --accent:#E2367A; --accent-ink:#FFFFFF; --accent-soft:#FCE1EC;
  --hp-ok:#2FB26A; --hp-mid:#EDB22A; --hp-low:#E0473B; --hp-bg:#E1DDEB;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c",ui-rounded,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13111D; --panel:#201D30; --soft:#2A2640; --ink:#F0ECFA; --muted:#ABA4C9; --line:#7C73B8; --shadow-c:#05040A;
    --accent:#FF5C9A; --accent-ink:#1A0A12; --accent-soft:#3D2036;
    --hp-ok:#3DC77B; --hp-mid:#F0BE3C; --hp-low:#F0605A; --hp-bg:#38334F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13111D; --panel:#201D30; --soft:#2A2640; --ink:#F0ECFA; --muted:#ABA4C9; --line:#7C73B8; --shadow-c:#05040A;
  --accent:#FF5C9A; --accent-ink:#1A0A12; --accent-soft:#3D2036;
  --hp-ok:#3DC77B; --hp-mid:#F0BE3C; --hp-low:#F0605A; --hp-bg:#38334F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;line-height:1.05;letter-spacing:.3px}
h2{font-size:28px}
h3{font-size:22px}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--shadow-c)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:14px}
.err{color:var(--hp-low);font-size:14px;font-weight:700}
.note{background:var(--accent-soft);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14.5px}
.btn{font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:var(--soft);border:3px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:3px 3px 0 var(--shadow-c);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
.btn:hover{background:var(--accent-soft)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-c)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shadow-c)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:disabled{opacity:1;background:var(--soft);color:var(--muted)}
.btn.sm{font-size:14px;padding:6px 12px}
.btn.big{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.4px;padding:12px 20px;width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:3px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
label{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:15px}
label.inline{flex-direction:row;align-items:center;gap:8px}
.kchip{display:inline-block;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:800;line-height:1.65;color:#fff;background:var(--kc);border:2px solid #1E1B2E;white-space:nowrap}
.tchip{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:800;line-height:1.6;color:var(--ink);background:var(--soft);border:2px solid var(--line);white-space:nowrap}
.stars{color:#E9A90E;letter-spacing:1px;font-size:15px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.4px}
.netinfo{font-size:13px;color:var(--muted);text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hp-low);border:2px solid var(--line);margin-right:5px;vertical-align:-1px}
.dot.on{background:var(--hp-ok)}
.pdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pc);border:2px solid #1E1B2E;flex:none}

/* home */
.hero{overflow:hidden}
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#2E2456;isolation:isolate;border-bottom:3px solid var(--line)}
.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hf{position:absolute;aspect-ratio:140/176}
.hf svg{display:block;width:100%;height:100%}
.hf.a{left:7%;bottom:6%;width:24%}
.hf.b{right:31%;bottom:16%;width:19%}
.hf.c{right:6%;bottom:5%;width:23%}
.hero .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px}
.title{font-family:var(--display);font-size:clamp(44px,11vw,70px);line-height:.92;letter-spacing:.5px}
.lead{font-size:18px;max-width:38ch}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
@media (min-width:560px){.actions{display:grid;grid-template-columns:1fr 1fr}.actions .wide{grid-column:1/-1}}
.rules p{max-width:62ch}
@media (prefers-reduced-motion:no-preference){
  .hf.a{animation:inL .7s cubic-bezier(.2,.9,.3,1.2) both}
  .hf.b{animation:inR .7s .1s cubic-bezier(.2,.9,.3,1.2) both}
  .hf.c{animation:inR .7s .2s cubic-bezier(.2,.9,.3,1.2) both}
}
@keyframes inL{from{transform:translateX(-160%)}to{transform:none}}
@keyframes inR{from{transform:translateX(260%)}to{transform:none}}

/* roster & picker */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;font:inherit;color:var(--ink);text-align:left;background:var(--soft);border:3px solid var(--line);border-radius:12px;padding:8px 10px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.card:hover{background:var(--accent-soft)}
.card[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
.card:disabled{opacity:.5;cursor:not-allowed}
.ci{position:relative;display:block;width:100%;height:100%}
.ci>svg{display:block;width:100%;height:100%}
.ci>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.ci.cv{border-radius:10px;overflow:hidden}
.ci.arena>img{border:calc(var(--u)*.35) solid var(--pc);border-radius:calc(var(--u)*1.1);box-shadow:0 calc(var(--u)*.4) calc(var(--u)*1.2) rgba(0,0,0,.6);box-sizing:border-box;height:82%;top:auto;bottom:6%}
.card .pic{display:block;width:70px;aspect-ratio:140/176;align-self:center}
.card .pic svg{display:block;width:100%;height:100%}
.card .nm{font-weight:800;font-size:15px;line-height:1.2}
.card .uni{font-size:12.5px;color:var(--muted);line-height:1.25}
.card .taken{font-size:12px;font-weight:800;color:var(--hp-low)}
.card.soon .pic{filter:grayscale(.85) brightness(.75)}
.card.locked .pic{filter:grayscale(1) brightness(.45)}
.locktag{display:inline-block;font-size:12px;font-weight:800;color:#EDE7FF;background:#3a3358;border-radius:6px;padding:2px 8px}
.ul-ov{position:fixed;inset:0;z-index:300;display:grid;place-items:center;padding:16px;background:rgba(5,4,11,.8)}
.ul-ov .mn-box{width:min(100%,760px)}
.ul-ov .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.soontag{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#1a1408;background:#e8c35a;border-radius:6px;padding:2px 8px}
.card .no{position:absolute;top:6px;left:8px;font-size:11.5px;font-weight:800;color:var(--muted)}
.rtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rtools input{flex:1 1 200px}
.seg{display:flex;border:3px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:800;font-size:14px;padding:7px 12px;background:var(--soft);color:var(--ink);border:0;border-right:2px solid var(--line);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.gtitle{font-size:20px;display:flex;align-items:center;gap:6px}
.card .badge[hidden]{display:none}
.card .badge{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:3px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{font:inherit;border:3px dashed var(--line);border-radius:12px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--muted);background:var(--soft);padding:4px;cursor:pointer;text-align:center;font-weight:700}
.slot.full{border-style:solid;color:var(--ink);background:var(--accent-soft)}
.slot .mini{width:44px;aspect-ratio:140/176}
.mini svg{display:block;width:100%;height:100%}
.sticky{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 22px);display:flex;flex-direction:column;gap:8px;z-index:4}
.skills{display:flex;flex-direction:column;gap:8px}
.sk{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:start;padding:9px 11px;border-radius:10px;background:var(--soft);border-left:8px solid var(--kc)}
.sk .sn{font-weight:800;font-size:16px}
.sk .tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.sk .sd{grid-column:1/-1;font-size:14px;color:var(--muted)}
.sk .sm{grid-column:1/-1;font-size:13px;font-weight:800}
.detail{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:start}
.detail .big{width:140px;aspect-ratio:140/176;background:var(--soft);border:3px solid var(--line);border-radius:12px;padding:6px}
.detail .big svg{display:block;width:100%;height:100%}
@media (max-width:480px){.detail{grid-template-columns:1fr}.detail .big{width:150px;justify-self:center}}

/* lobby */
.room{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px}
.room .code{font-family:var(--display);font-size:36px;letter-spacing:5px;line-height:1}
.room .roomhint{flex:1 1 220px;font-size:13.5px;color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--soft);font-weight:700;font-size:15px}
.prow .st{margin-left:auto;font-size:13px;color:var(--muted)}
.prow .st.ok{color:var(--hp-ok)}
.prow .st.bad{color:var(--hp-low)}

.wait{color:var(--muted);text-align:center;padding:10px;font-weight:700}
/* ---------- menu inicial: imagem com os botões desenhados ---------- */
body.menu-on{overflow:hidden;background:#0a0618}
body.menu-on .wrap{max-width:none;padding:0}
.mn{position:fixed;inset:0;display:grid;place-items:center;background:#0a0618;overflow:hidden}
.mn-stage{position:relative;width:min(100vw,calc(100vh*1671/941));aspect-ratio:1671/941;container-type:inline-size}
.mn-img{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mn-hit{position:absolute;padding:0;margin:0;border:0;background:transparent;border-radius:1.2cqw;cursor:pointer;transition:box-shadow .15s,background-color .15s;-webkit-tap-highlight-color:transparent}
.mn-hit:hover,.mn-hit:focus-visible{background:rgba(255,255,255,.08);box-shadow:0 0 0 .25cqw rgba(255,236,170,.9),0 0 2.4cqw rgba(255,200,90,.7);outline:none}
.mn-hit:active{background:rgba(255,255,255,.16)}
.mn-hit .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mn-stage.noimg{background:radial-gradient(ellipse at 50% 40%,#3a1f7a,#0a0618 70%)}
.mn-stage.noimg::before{content:'NEW WORLD RPG';position:absolute;left:0;right:0;top:36%;text-align:center;font-family:"Pixelify Sans",var(--display);font-weight:700;font-size:7cqw;color:#F7D774;text-shadow:0 .4cqw 0 #7a4a0c}
.mn-stage.noimg .mn-hit{background:linear-gradient(#2a2160,#151034);box-shadow:0 0 0 .25cqw #F2C14E}
.mn-stage.noimg .mn-hit .lb{position:static;width:auto;clip:auto;display:grid;place-items:center;height:100%;font-family:"Pixelify Sans",var(--display);font-weight:700;font-size:2.6cqw;color:#FFE7A3;text-transform:uppercase}
/* quadro do jogador por cima do desenhado na imagem (posição em % da imagem de 1671x941) */
.mn-prof{position:absolute;left:.55%;top:1%;width:22.9%;height:9.8%;display:flex;align-items:center;gap:1cqw;padding:.4cqw .9cqw .4cqw .4cqw;margin:0;cursor:pointer;text-align:left;color:#fff;
  background:linear-gradient(#1c1640,#0d0a22);border:.22cqw solid #F2C14E;border-radius:.9cqw;box-shadow:0 0 0 .15cqw #3a2a0a,0 .4cqw 1.2cqw rgba(0,0,0,.55);transition:box-shadow .15s}
.mn-prof:hover,.mn-prof:focus-visible{outline:none;box-shadow:0 0 0 .25cqw rgba(255,236,170,.9),0 0 2.4cqw rgba(255,200,90,.7)}
.mn-prof .pf-av{flex:none;height:100%;aspect-ratio:1;border:.2cqw solid #F2C14E;border-radius:.6cqw;background:#2a2160 radial-gradient(circle at 50% 38%,#4a3f8f 0 22%,transparent 23%),radial-gradient(ellipse at 50% 100%,#4a3f8f 0 45%,#2a2160 46%);overflow:hidden;position:relative}
.pf-av img,.pf-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block}
.mn-prof .pf-tx{display:flex;flex-direction:column;gap:.35cqw;min-width:0}
.mn-prof .pf-nm{font-family:"Pixelify Sans",var(--display);font-weight:700;font-size:1.75cqw;line-height:1.05;color:#FFE7A3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 .15cqw 0 #3a2a0a}
.mn-prof .pf-st{font-size:1.05cqw;color:#d8d0ff;white-space:nowrap}
.mn-stage.noimg .mn-prof{left:2%;top:2%}
/* caixa de sugestões, no canto de cima à direita */
.mn-sug{position:absolute;right:.55%;top:1%;height:7.6%;display:flex;align-items:center;gap:.8cqw;padding:0 1.2cqw 0 .9cqw;margin:0;cursor:pointer;color:#FFE7A3;font-family:"Pixelify Sans",var(--display);font-weight:700;font-size:1.5cqw;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(#1c1640,#0d0a22);border:.22cqw solid #F2C14E;border-radius:.9cqw;box-shadow:0 0 0 .15cqw #3a2a0a,0 .4cqw 1.2cqw rgba(0,0,0,.55);transition:box-shadow .15s}
.mn-sug:hover,.mn-sug:focus-visible{outline:none;box-shadow:0 0 0 .25cqw rgba(255,236,170,.9),0 0 2.4cqw rgba(255,200,90,.7)}
.mn-sug svg{width:2.2cqw;height:2.2cqw;flex:none}
.mn-sug small{display:block;font-family:var(--body);font-size:.85cqw;font-weight:700;letter-spacing:0;text-transform:none;color:#b9b0dd}
.mn-stage.noimg .mn-sug{right:2%;top:2%}
.sg-txt{font:inherit;width:100%;box-sizing:border-box;min-height:130px;resize:vertical;padding:10px 12px;border-radius:10px;border:2px solid #4a3f8f;background:#0d0a22;color:#fff}
.sg-txt:focus{outline:none;border-color:#F2C14E}
.sg-old{padding:10px 12px;background:rgba(0,0,0,.25);border:2px solid #3a3170;border-radius:10px;white-space:pre-wrap;color:#d8d0ff}
.sg-cnt{font-size:13px;color:#9f96c8;text-align:right}
.pf-box{gap:10px}
.pf-lab{display:flex;flex-direction:column;gap:6px;font-weight:700;color:#F7D774}
.pf-lab input{font:inherit;font-weight:400;padding:10px 12px;border-radius:10px;border:2px solid #4a3f8f;background:#0d0a22;color:#fff}
.pf-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
@media (max-width:480px){.pf-grid{grid-template-columns:repeat(4,1fr)}}
.pf-pick{padding:0;border:3px solid #3a3170;border-radius:10px;background:#0d0a22;cursor:pointer;aspect-ratio:1;overflow:hidden;transition:transform .1s}
.pf-pick:hover{transform:scale(1.05)}
.pf-pick[aria-pressed="true"]{border-color:#F2C14E;box-shadow:0 0 0 2px #F2C14E,0 0 14px rgba(242,193,78,.6)}
.pf-pic{display:block;position:relative;width:100%;height:100%}
.pf-stats{display:flex;flex-direction:column;gap:4px;padding:10px 12px;background:rgba(0,0,0,.25);border:2px solid #3a3170;border-radius:10px}
.pf-row{display:flex;justify-content:space-between;gap:12px}
.pf-row b{color:#F7D774}
.pf-btns{display:flex;justify-content:flex-end;gap:10px}
.pf-acct{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:rgba(0,0,0,.25);border:2px solid #3a3170;border-radius:10px}
.pf-acct .pf-row{align-items:center;flex-wrap:wrap}
.pf-acct .err{min-height:0}
.mn-ov{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(5,4,11,.72)}
.mn-ov[hidden]{display:none}
.mn-box{width:min(100%,680px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:20px 24px;background:linear-gradient(#1a1535,#0e0b20);border:3px solid #F2C14E;border-radius:14px;color:#EDE7FF;font-size:15.5px}
.mn-box h2{font-family:"Pixelify Sans",var(--display);font-weight:700;color:#F7D774;font-size:24px}
.mn-box p{margin:0}
.mn-box .seg{border-color:#4a3f8f}
.mn-box .seg button{background:#1d1844;color:#EDE7FF;border-right-color:#4a3f8f}
.mn-box .seg button[aria-pressed="true"]{background:#F2C14E;color:#2a1a00}
.mn-box #mnclose{align-self:flex-end}
/* ---------- batalha: palco 16:9 (tudo medido em --u = 1% da altura do palco) ---------- */
body.bt-on{overflow:hidden}
body.bt-on .wrap{max-width:none;padding:0}
/* Telas antes da batalha (11/11/2026): configuração (treino, entrada online, sala) e escolha de personagem, no visual da batalha. */
.ps{--gold:#F2C14E;--gold2:#FFE7A3;--pix:"Pixelify Sans","Lilita One",system-ui,sans-serif;position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;background:#05040b;color:#EDE7FF;overflow:hidden}
.ps>*{position:relative}
.ps>.ps-bg{position:absolute;inset:-3%;background:center/cover no-repeat;filter:brightness(.34) saturate(.85)}
.ps-top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(#120d26,rgba(8,6,15,.8));border-bottom:2px solid #c99a3c;flex:none}
.ps-ttl{flex:1;min-width:0;text-align:center;font-family:var(--pix);font-weight:700;color:var(--gold2);font-size:clamp(16px,2.2vw,26px);letter-spacing:.06em;text-transform:uppercase;text-shadow:0 2px 0 #3a2a0a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps-top .ps-sub{max-width:30%;text-align:right}
.ps-btn,.ps .btn{font-family:var(--pix);font-weight:700;font-size:15px;color:var(--gold2);padding:8px 14px;border:2px solid #6b5420;border-radius:8px;background:linear-gradient(#2a2040,#141024);box-shadow:none;cursor:pointer;width:auto;letter-spacing:.02em}
.ps-btn:hover:not(:disabled),.ps .btn:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(#352a50,#1a1430)}
.ps-btn.gold,.ps .btn.primary{border-color:var(--gold);color:var(--gold2);background:linear-gradient(#4a3509,#1e1504);box-shadow:0 0 14px rgba(242,193,78,.35)}

function flatOf(ch){return ch.fx.reduce((a,f)=>f.k==='buff'&&f.flat?a+f.flat:a,0)}

function byHp(list,hp){for(const [th,v] of list)if(hp>th)return v;return list[list.length-1][1]}

const copyable=k=>!!k&&(k.kind==='ataque'||k.kind==='tecnica')&&!k.passive&&!k.transform&&!k.auto&&!(k.buff&&k.buff.chain)&&!k.revive&&!k.genki&&!k.alsoTech&&!k.ctrl&&!k.copy&&!k.once&&!k.needHeal&&!k.boostEcho;
function removeFx(B,s,c,f,ev){
  const ch=B.sides[s].chars[c];
  if(f.k==='buff'){endBuff(B,s,c,f,ev,s===B.cur);return}
  ch.fx=ch.fx.filter(x=>x!==f);
  if(f.k==='jail'){const k=B.sides[f.by[0]].chars[f.by[1]];k.fx.filter(x=>x.k==='bound'&&isAt(x.with,s,c)).forEach(x=>boundEnd(B,f.by[0],f.by[1],x));k.fx=k.fx.filter(x=>!(x.k==='bound'&&isAt(x.with,s,c)))}
  if(f.k==='bound'){boundEnd(B,s,c,f);const pr=B.sides[f.with[0]].chars[f.with[1]];if(pr.fx.some(x=>x.k==='jail'&&isAt(x.by,s,c))){pr.fx=pr.fx.filter(x=>!(x.k==='jail'&&isAt(x.by,s,c)));ev.push({t:'msg',k:'unjail',s:f.with[0],c:f.with[1]})}}

/* Sair da prisão (ação 'x'). Corrente do Julgamento: só o preso sai, levando o dano de saída.
   Bankou (mutual): o preso ou o Mestre Kame soltam os dois, de graça, depois dos 2 primeiros turnos de cada um (lock). */
function canExit(B,s,c){
  const ch=B.sides[s]&&B.sides[s].chars[c];if(!ch||ch.dead)return null;
  const f=ch.fx.find(x=>x.k==='jail');
  if(f)return (f.lock||0)>0?null:{p:[s,c],f};
  const b=ch.fx.find(x=>x.k==='bound'&&x.mutual);if(!b||(b.lock||0)>0)return null;
  const pr=B.sides[b.with[0]].chars[b.with[1]],pf=pr&&pr.fx.find(x=>x.k==='jail'&&isAt(x.by,s,c));
  return pf?{p:b.with,f:pf}:null;

function doExit(B,s,c,ev){
  const e=canExit(B,s,c);if(!e)return false;
  const [ps,pc]=e.p,f=e.f,pr=B.sides[ps].chars[pc];
  pr.fx=pr.fx.filter(x=>x!==f);
  const k=B.sides[f.by[0]].chars[f.by[1]];
  k.fx.filter(x=>x.k==='bound'&&isAt(x.with,ps,pc)).forEach(x=>boundEnd(B,f.by[0],f.by[1],x));
  k.fx=k.fx.filter(x=>!(x.k==='bound'&&isAt(x.with,ps,pc)));
  ev.push(f.mutual?{t:'msg',k:'exit',s,c,amt:0,ps,pc,mutual:1}:{t:'msg',k:'exit',s,c,amt:f.exitDmg});
  if(f.exitDmg)damage(B,ps,pc,f.exitDmg,ev,'self');
  ev.push({t:'sync',st:snapshot(B)});
  return true;
}
function finish(B,winner,ev){B.phase='over';B.winner=winner;ev.push({t:'sync',st:snapshot(B)},{t:'msg',k:'end',w:winner},{t:'end',w:winner})}
function checkOut(B,ev){
  if(B.phase==='over')return true;
  B.sides.forEach((sd,s)=>{if(!sd.out&&sd.chars.every(ch=>ch.dead)){sd.out=true;ev.push({t:'msg',k:'out',s})}});
  const al=[];B.sides.forEach((sd,s)=>{if(!sd.out)al.push(s)});
  if(al.length<=1){finish(B,al.length?al[0]:-1,ev);return true}
  return false;
}
function endBuff(B,s,c,f,ev,mid){
  const ch=B.sides[s].chars[c];ch.fx=ch.fx.filter(x=>x!==f);
  if(f.cdAfter)ch.cd[f.id]=f.cdAfter+(mid?1:0);
  if(f.links)dropLinks(B,s,c);
  ev.push({t:'msg',k:'buffend',s,c,name:f.name});
  if(f.afterStun&&!ch.dead){const left=f.afterStun+(mid?1:0),st=ch.fx.find(x=>x.k==='stun');if(st)st.left=Math.max(st.left,left);else ch.fx.push({k:'stun',name:'Sem agir',left});ev.push({t:'msg',k:'stun',s,c,n:f.afterStun})}

    damage(B,s,c,f.hpBonus,ev,'self');
    if(!ch.dead)ch.hp=Math.min(ch.hp,ch.max);

// ramp (Sunshine): o multiplicador sobe com a idade da técnica (age = qual turno dela é o atual). [[4,2],[8,4]] = x2 a partir do 4º, x4 a partir do 8º.
function rampMult(f){let m=1;for(const [a,x] of f.ramp)if((f.age||1)>=a)m=x;return m}

function dmgMult(ch){return ch.fx.reduce((m,f)=>f.k==='buff'?m*buffMult(f):m,1)}
function startOfTurn(B,s,ev){
  B.sides.forEach((sd,j)=>sd.chars.forEach((ch,c)=>{
    for(const f of ch.fx.slice()){
      if(ch.dead||f.own!==s)continue;
      // Punho Divergente: o segundo golpe cai no começo da próxima vez de quem usou, sem gastar ação.
      if(f.k==='echo'){ch.fx=ch.fx.filter(x=>x!==f);const by=B.sides[f.by[0]].chars[f.by[1]];if(by.dead)continue;ev.push({t:'msg',k:'echo',s:j,c,bs:f.by[0],bc:f.by[1],amt:f.dmg,name:f.name});damage(B,j,c,f.dmg,ev,'echo');continue}
      if(f.k==='hot'){healCh(B,j,c,f.heal,ev);f.left--;if(f.left<=0)ch.fx=ch.fx.filter(x=>x!==f);continue}
      if(f.k!=='dot')continue;
      ev.push({t:'msg',k:'dot',s:j,c,name:f.name,amt:f.dmg});
      damage(B,j,c,f.dmg,ev,'dot');
      if(ch.dead)continue;
      f.left--;if(f.left<=0){ch.fx=ch.fx.filter(x=>x!==f);if(f.endHit)fireEnd(B,f,ev)}
    }
  }));
  B.sides[s].chars.forEach((ch,c)=>{if(ch.fx.some(f=>f.k==='invul'&&!f.until)){ch.fx=ch.fx.filter(f=>!(f.k==='invul'&&!f.until));ev.push({t:'msg',k:'invulend',s,c})}});
  B.sides[s].chars.forEach((ch,c)=>{if(ch.dead)return;for(const f of ch.fx)if(f.k==='buff'&&f.ramp){const m0=rampMult(f);f.age=(f.age||1)+1;const m1=rampMult(f);if(m1!==m0)ev.push({t:'msg',k:'rampup',s,c,name:f.name,x:m1})}});
  startPend(B,s,ev);
  // Controlado (Marionete, Axii): não age nesta vez; o ataque dele acontece no começo do applyTurn.
  B.sides[s].chars.forEach(ch=>{if(!ch.dead&&ch.fx.some(f=>f.k==='ctrl')&&!ch.fx.some(f=>f.k==='skip'))ch.fx.push({k:'skip',name:'Controlado'})});
  ev.push({t:'sync',st:snapshot(B)});
}
function advance(B,ev){
  let nx=B.cur,wrapped=false;
  for(let i=0;i<B.n;i++){nx=(nx+1)%B.n;if(nx===0)wrapped=true;if(!B.sides[nx].out)break}
  B.cur=nx;
  if(wrapped){B.round++;
    B.sides.forEach((sd,s)=>sd.chars.forEach((ch,c)=>{if(!ch.dead&&ch.fx.some(f=>f.k==='invul'&&f.until&&f.until<B.round)){ch.fx=ch.fx.filter(f=>!(f.k==='invul'&&f.until&&f.until<B.round));ev.push({t:'msg',k:'invulend',s,c})}}));
    if(B.round>ROUND_MAX)timeout(B,ev)}
}
function timeout(B,ev){
  let best=-1,bv=-1,tie=false;
  B.sides.forEach((sd,s)=>{if(sd.out)return;const v=sd.chars.reduce((a,ch)=>a+ch.hp,0);if(v>bv){bv=v;best=s;tie=false}else if(v===bv)tie=true});
  ev.push({t:'msg',k:'timeout'});finish(B,tie?-1:best,ev);

function beginTurn(B,ev){
  for(let g=0;g<12&&B.phase!=='over';g++){
    if(B.sides[B.cur].out){advance(B,ev);continue}
    ev.push({t:'turn',s:B.cur,round:B.round});
    startOfTurn(B,B.cur,ev);
    if(checkOut(B,ev))return;
    if(B.sides[B.cur].out){advance(B,ev);continue}
    return;
  }
}
function decodeTurn(str){
  if(typeof str!=='string'||!str||str==='-')return [];
  const pairs=s=>(s.match(/../g)||[]).map(p=>[+p[0],+p[1]]);
  // Controle (Marionete, Axii): depois de ':' vem a letra do ataque do controlado e as vítimas. Ex.: '0d10:b11'.
  return str.split('.').slice(0,7).map(a=>{if(a[1]==='x')return {c:+a[0],k:'x',t:[]};const [m,x]=a.split(':'),o={c:+m[0],k:SKL.indexOf(m[1]),t:pairs(m.slice(2))};if(x)o.ctrl={k:SKL.indexOf(x[0]),t:pairs(x.slice(1))};return o});
}
function encodeTurn(acts){return acts.length?acts.map(a=>a.k==='x'?`${a.c}x`:`${a.c}${SKL[a.k]}${a.t.map(x=>''+x[0]+x[1]).join('')}`+(a.ctrl?`:${SKL[a.ctrl.k]}${a.ctrl.t.map(x=>''+x[0]+x[1]).join('')}`:'')).join('.'):'-'}
function skillCheck(B,s,c,k,used){
  const ch=B.sides[s]&&B.sides[s].chars[c];if(!ch)return 'Inválido';
  const d=RBY[ch.id],sk=d.sk[k];if(!sk)return 'Inválido';
  if(ch.dead)return 'Fora de combate';
  if(isJailed(ch))return 'Preso na Corrente do Julgamento';
  if(ch.fx.some(f=>f.k==='bound'))return 'Segurando a Corrente do Julgamento';
  if(isStunned(ch))return 'Sem poder agir neste turno';
  if(sk.passive)return 'Passiva: sempre ligada';
  if(sk.kind==='counter')return 'Só na hora em que for atacado';
  if(sk.auto)return hasBuff(ch,sk.id)?'Ativa':'Começa sozinha';
  if(sk.noWith&&hasBuff(ch,sk.noWith))return `Não dá com ${skillById(d,sk.noWith).n} ativo`;
  if((sk.kind==='tecnica'||sk.alsoTech)&&ch.fx.some(f=>f.k==='silence'))return 'Sem poder usar técnicas';
  if(sk.once&&ch.used1&&ch.used1[sk.id])return 'Só uma vez por partida';
  if(sk.needHeal&&(ch.hg||0)<sk.needHeal)return `Precisa recuperar ${sk.needHeal} de vida (${ch.hg||0}/${sk.needHeal})`;
  if(sk.boostEcho&&!B.sides.some(sd=>sd.chars.some(x=>!x.dead&&x.fx.some(f=>f.k==='echo'&&isAt(f.by,s,c)))))return 'Use o Punho Divergente antes';
  const u=used[c];

  if(!u&&Object.keys(used).length>=2&&!bonusOk)return 'Já tem 2 personagens agindo';
  if(sk.kind==='ataque'&&u&&u.atk&&!bonusOk)return u.bonus?'Já usou o ataque extra':'Já atacou neste turno';
  if((sk.kind!=='ataque'||sk.alsoTech)&&u&&u.extra)return 'Já usou técnica neste turno';
  if(sk.alsoTech&&u&&u.atk)return 'Já atacou neste turno';
  if(sk.alsoTech&&ch.ex===B.round)return 'Já usou counter nesta rodada';
  if(sk.kind==='tecnica'&&ch.ex===B.round)return 'Já usou counter nesta rodada';
  if((ch.cd[sk.id]||0)>0){const n=ch.cd[sk.id];return `Recarga: ${n} turno${n>1?'s':''}`}
  if(sk.charges&&!(ch.ch[chKey(sk)]>0))return 'Sem usos restantes';
  if(sk.req&&!hasBuff(ch,sk.req))return ch.fx.some(f=>f.k==='pend'&&f.id===sk.req)?`${skillById(d,sk.req).n} só vale na próxima vez`:`Precisa de ${skillById(d,sk.req).n} ativa`;

  if(sk.hpBelow&&ch.hp>=sk.hpBelow)return `Só com ${sk.hpBelow-1} de vida ou menos`;
  if(sk.fromRound&&B.round<sk.fromRound)return `Só a partir da rodada ${sk.fromRound}`;
  if(sk.tg!=='self'&&targetsFor(B,s,c,sk,used).length<(sk.minT||1))return sk.inRoom?'Nenhum inimigo preso na Room':sk.tg==='ally'?'Nenhum aliado de pé':'Nenhum alvo disponível';
  return '';
}
function enemiesOf(B,s){const r=[];B.sides.forEach((sd,j)=>{if(j===s||sd.out)return;sd.chars.forEach((ch,c)=>{if(!ch.dead)r.push([j,c])})});return r}
function tauntersOf(B,s,c){return B.sides[s].chars[c].fx.filter(f=>f.k==='taunt').map(f=>f.by).filter(b=>B.sides[b[0]]&&!B.sides[b[0]].out&&!B.sides[b[0]].chars[b[1]].dead)}
function targetsFor(B,s,c,sk,used){
  if(sk.tg==='self')return [];
  if(sk.tg==='ally'){const r=[];B.sides[s].chars.forEach((x,i)=>{if(i!==c&&!x.dead)r.push([s,i])});return r}
  // team (Saifojio): qualquer um de pé do próprio time, inclusive ele.
  if(sk.tg==='team'){const r=[];B.sides[s].chars.forEach((x,i)=>{if(!x.dead)r.push([s,i])});return r}
  let en=enemiesOf(B,s).filter(e=>!isInvuln(B.sides[e[0]].chars[e[1]]));

  if(sk.kind==='ataque'||sk.alsoTech)en=en.filter(e=>!hasUntarget(B.sides[e[0]].chars[e[1]]));
  const tt=tauntersOf(B,s,c);
  if(tt.length)en=en.filter(e=>tt.some(t=>t[0]===e[0]&&t[1]===e[1]));
  // any (Círculo de Transferência): qualquer personagem de pé do próprio time (inclusive ele) mais os inimigos que ele pode mirar.
  if(sk.tg==='any'){const r=[];B.sides[s].chars.forEach((x,i)=>{if(!x.dead)r.push([s,i])});return r.concat(en)}

  if(isBonusAtk(B,s,c,sk,used)){const v=bonusOf(B.sides[s].chars[c]).vs;en=en.filter(e=>e[0]===v[0]&&e[1]===v[1])}

function applyStun(B,j,c,n,ev){
  const t=B.sides[j].chars[c];if(t.dead)return;
  if(isInvuln(t)){ev.push({t:'msg',k:'invuln',s:j,c});return}

  if(hasResist(t)){ev.push({t:'msg',k:'resist',s:j,c});return}

/* Counter: não se usa na vez do dono. Quando o personagem é atacado, o dono escolhe na hora se usa.
   Divide com a técnica o uso extra da rodada: ch.ex guarda a rodada em que esse uso foi gasto.
   rs diz quem responde: undefined = ninguém usa counter (prévia da tela de planejar);
   'cpu' = todos decidem pela regra do computador (previsão do computador);
   {R,wait} = jogada valendo. Lados do computador (B.cpu) decidem pela regra; humanos pela lista R[lado],
   lida em ordem (B.ri[lado]). Sem resposta e com wait, lança um erro com .need e para no meio. */
const physOnly=sk=>{const t=sk.tags||[];return t.includes('fisica')&&!t.includes('magica')};
function counterOpts(B,j,c,sk){
  const t=B.sides[j].chars[c];if(!canAct(t)||t.ex===B.round||t.fx.some(f=>f.k==='nocounter'))return [];
  const r=[];RBY[t.id].sk.forEach((k,i)=>{if(k.kind==='counter'&&!((t.cd[k.id]||0)>0)&&!(k.charges&&!(t.ch[chKey(k)]>0))&&!(k.physOnly&&!physOnly(sk))&&!(k.magicOnly&&!(sk.tags||[]).includes('magica'))&&!(k.req&&!hasBuff(t,k.req))&&!(k.noWith&&hasBuff(t,k.noWith)))r.push(i)});

/* Counter de um aliado que protege outro (Chajiru Seshirudon da Tia). Na lista de opções vira o código 100 + personagem*10 + habilidade,

function guardOpts(B,j,c){
  const r=[];B.sides[j].chars.forEach((g,gi)=>{if(gi===c||!canAct(g)||g.ex===B.round||g.fx.some(f=>f.k==='nocounter'))return;
    RBY[g.id].sk.forEach((k,i)=>{if(k.kind==='counter'&&k.guard&&!((g.cd[k.id]||0)>0)&&!(k.charges&&!(g.ch[chKey(k)]>0)))r.push(100+gi*10+i)})});

const counterSk=(B,j,c,k)=>k>=100?RBY[B.sides[j].chars[Math.floor((k-100)/10)].id].sk[k%10]:RBY[B.sides[j].chars[c].id].sk[k];
function boltMult(t,sk){const e=sk.bolt&&sk.dmg?t.fx.find(f=>f.k==='elec'):null;return e?1+e.left:1}
// Alvos do counter que escolhe alvo (Corrente Nebulosa): qualquer inimigo de pé que não esteja invulnerável.

// Resposta: null (não usa) ou {k: habilidade, t: alvo escolhido ou null}. Na lista R, cada item é

function askCounter(B,rs,s,a,sk,j,c,opts){

      left:opts.map(k=>{const cs=counterSk(B,j,c,k),o=k>=100?B.sides[j].chars[Math.floor((k-100)/10)]:t;return cs.charges?o.ch[chKey(cs)]:null}),
      tgts:opts.some(k=>counterSk(B,j,c,k).cmode==='strike'||counterSk(B,j,c,k).cmode==='yrden')?strikeTargets(B,j):opts.some(k=>counterSk(B,j,c,k).cmode==='redirect')?redirectTargets(B,j,s,a.c):[]};

function cpuCounter(B,s,a,sk,j,c,opts){

const charArt=(id,color,face)=>withIcon(id,fighter(color||NEUTRAL,RBY[id]?initials(RBY[id].n):'?',face||'r'),'cv');function skillMeta(sk){
  const p=[];
  if(sk.kind==='counter')p.push('Usado na hora em que o personagem é atacado');else if(sk.tg==='enemy')p.push(sk.maxT>1?`Até ${sk.maxT} inimigos`:'1 inimigo');else if(sk.tg==='all')p.push('Todos os inimigos');else if(sk.tg==='ally')p.push('Em um aliado');else if(sk.tg==='any')p.push(`${sk.maxT||1} personagens quaisquer`);else p.push('Em si mesmo');if(sk.auto)p.push('Começa sozinha');
  if(sk.kind==='tecnica'&&sk.delay)p.push('Carrega e vale na próxima vez');else if(sk.kind==='tecnica'&&!sk.auto)p.push('Vale na hora');
  if(sk.magicOnly)p.push('Só contra ataque mágico');
  if(sk.alsoTech)p.push('Ataque e técnica juntos');
  if(sk.ctrl)p.push('Controla a próxima vez do alvo');
  if(sk.nocounter)p.push('Alvo sem counter por um tempo');
  if(sk.kind==='tecnica'&&sk.dmg)p.push('Técnica: não pode ser bloqueada');
  if(sk.inRoom)p.push('Só em inimigos presos na Room');
  if(sk.pierce)p.push('Ignora counters');
  if(sk.hpBelow)p.push(`Só com ${sk.hpBelow-1} de vida ou menos`);
  if(sk.fromRound)p.push(`Só a partir da rodada ${sk.fromRound}`);
  if(sk.physOnly)p.push('Só contra ataques só físicos');
  if(sk.req)p.push('Precisa de técnica ativa');
  if(sk.cd)p.push(`Recarga de ${sk.cd} turno${sk.cd>1?'s':''}`);
  if(sk.charges)p.push(sk.charges>1?`${sk.charges} usos por partida`:'1 uso por partida');
  return p.join('. ')+'.';
}

/* ---------- platform ---------- */
/* Sala online. Dentro do Claude (artifact), usa a capacidade room. Fora dele (GitHub Pages ou arquivo local),
   usa conexão direta entre os aparelhos com PeerJS (peerRoom), com a mesma interface: join, presence, onPeers,
   onConnection, leave. O resto do jogo não sabe qual das duas está em uso. */
const CAP={state:'pending',room:null,kind:''};
(async()=>{
  const c=window.claude;
  if(c&&typeof c.use==='function'){try{const room=await c.use('room');if(room){CAP.room=room;CAP.state='ok';CAP.kind='claude';onCapsChanged();return}}catch(e){}}
  CAP.room={join:async name=>{await loadPeerJS();return peerRoom(name)}};CAP.state='ok';CAP.kind='peer';
  setTimeout(onCapsChanged,0);
})();
function onCapsChanged(){if(app.screen==='online')renderOnline(app.prefill)}
const PEERJS_URL='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
let peerJsP=null;
function loadPeerJS(){
  if(window.Peer)return Promise.resolve();
  return peerJsP||(peerJsP=new Promise((res,rej)=>{const s=document.createElement('script');s.src=PEERJS_URL;s.onload=()=>window.Peer?res():rej(new Error('peerjs'));s.onerror=()=>{peerJsP=null;rej(new Error('peerjs'))};document.head.appendChild(s)}));
}
/* Sala por PeerJS: quem conseguir o nome fixo da sala (nwrpg-v1-<sala>) vira o centro e repassa a presença de
   todos pra todos. Os outros entram como clientes. Se o centro sair, os demais disputam o nome de novo e a sala
   se refaz sozinha; como cada presença carrega o histórico inteiro (acts/rsp), a partida continua de onde estava. */
function peerRoom(name){
  const hubId='nwrpg-v1-'+String(name).toLowerCase().replace(/[^a-z0-9-]/g,'');
  const S={me:null,list:[],cbP:new Set(),cbC:new Set(),peer:null,hubConn:null,clients:new Map(),isHub:false,closed:false,up:false,key:rid(),retry:0,timer:0};
  const emitPeers=()=>{const peers=S.list.map(x=>({presence:x.presence,sameTab:x.key===S.key}));S.cbP.forEach(f=>{try{f({peers})}catch(e){}})};
  const setUp=v=>{if(S.up===v)return;S.up=v;S.cbC.forEach(f=>{try{f(v)}catch(e){}})};
  const hubList=()=>{const a=[];if(S.me)a.push({key:S.key,presence:S.me});S.clients.forEach((c,k)=>{if(c.p)a.push({key:k,presence:c.p})});return a};
  const hubBroadcast=()=>{S.list=hubList();const msg={t:'peers',list:S.list};S.clients.forEach(c=>{if(c.conn.open)try{c.conn.send(msg)}catch(e){}});emitPeers()};
  function restart(){
    if(S.closed)return;clearTimeout(S.timer);
    try{S.peer&&S.peer.destroy()}catch(e){}S.peer=null;S.hubConn=null;S.isHub=false;S.clients.clear();setUp(false);
    S.retry=Math.min(S.retry+1,6);S.timer=setTimeout(start,400+Math.random()*600*S.retry);
  }
  function asHub(peer){
    S.isHub=true;S.peer=peer;S.retry=0;setUp(true);
    peer.on('connection',conn=>{
      conn.on('open',()=>{S.clients.set(conn.peer,{conn,p:null});try{conn.send({t:'peers',list:hubList()})}catch(e){}});
      conn.on('data',d=>{if(d&&d.t==='presence'&&d.p&&typeof d.p==='object'){const c=S.clients.get(conn.peer);if(c){c.p=d.p;hubBroadcast()}}});
      const drop=()=>{if(S.clients.delete(conn.peer))hubBroadcast()};conn.on('close',drop);conn.on('error',drop);
    });
    peer.on('disconnected',()=>{if(!S.closed&&S.peer===peer)try{peer.reconnect()}catch(e){}});
    hubBroadcast();
  }
  function asClient(peer){
    S.isHub=false;S.peer=peer;
    const conn=peer.connect(hubId,{reliable:true,serialization:'json'});S.hubConn=conn;
    const lost=()=>{if(S.hubConn===conn)restart()};
    conn.on('open',()=>{if(S.hubConn!==conn)return;S.retry=0;setUp(true);if(S.me)try{conn.send({t:'presence',p:S.me})}catch(e){}});
    conn.on('data',d=>{if(S.hubConn===conn&&d&&d.t==='peers'&&Array.isArray(d.list)){S.list=d.list.filter(x=>x&&typeof x==='object');emitPeers()}});
    conn.on('close',lost);conn.on('error',lost);
    peer.on('error',e=>{if(e&&e.type==='peer-unavailable')lost()});
    peer.on('disconnected',()=>{if(!S.closed&&S.peer===peer)try{peer.reconnect()}catch(e){}});
    setTimeout(()=>{if(S.hubConn===conn&&!conn.open)lost()},9000);
  }
  function start(){
    if(S.closed)return;
    let done=false;const p=new Peer(hubId,{debug:0});S.peer=p;
    p.on('open',()=>{if(done||S.closed)return;done=true;asHub(p)});
    p.on('error',e=>{
      if(done)return;done=true;try{p.destroy()}catch(_){}
      if(e&&e.type==='unavailable-id'){const c=new Peer(undefined,{debug:0});S.peer=c;let ok=false;c.on('open',()=>{ok=true;if(!S.closed)asClient(c)});c.on('error',()=>{if(!ok)restart()})}
      else restart();
    });
  }
  start();
  return {
    presence(p){S.me=p;if(S.isHub)hubBroadcast();else if(S.hubConn&&S.hubConn.open)try{S.hubConn.send({t:'presence',p})}catch(e){}return Promise.resolve()},
    onPeers(cb){S.cbP.add(cb);if(S.list.length)emitPeers();return ()=>S.cbP.delete(cb)},
    onConnection(cb){S.cbC.add(cb);try{cb(S.up)}catch(e){}return ()=>S.cbC.delete(cb)},
    leave(){S.closed=true;clearTimeout(S.timer);try{S.hubConn&&S.hubConn.close()}catch(e){}try{S.peer&&S.peer.destroy()}catch(e){}S.cbP.clear();S.cbC.clear()}
  };
}

const app={screen:'home',mode:null,prefill:'',fill:true};
let M=null,teamSel=[],teamInfo=null;
const NET={room:null,code:null,me:null,peers:[],conn:false,unsubs:[],os:[],host:null};
const topBar=right=>`<header class="topbar"><span class="logo">New World RPG</span>${right||''}</header>`;
const NEED2=6,NEED3=9;
/* Modos online. 'livre': time de 3, sem regra de estrelas, 2 ou 3 jogadores conforme quem entrar.
   'bal' (Balanceado, nome provisório): o anfitrião escolhe 2 ou 3 jogadores, o time tem esse mesmo número
   de personagens, e cabe no máximo 1 de 5★, 1 de 4★ e 1 de 3★ por time (2★ e 1★ podem repetir).
   O anfitrião publica a escolha na presença (cfg), e ela vai junto no lineup. */
const MODE_NAME={livre:'Livre',bal:'Balanceado'};
function sanCfg(c){return c&&c.m==='bal'?{m:'bal',n:c.n===2?2:3}:{m:'livre',n:3}}
function curCfg(){if(app.mode!=='online'||!NET.me)return {m:'livre',n:3};return sanCfg((NET.host||meAsPeer()).cfg)}
const pickCfg=()=>app.mode==='online'?curCfg():{m:'livre',n:3};
const teamSize=cfg=>cfg.m==='bal'?cfg.n:3;
const maxPlayers=cfg=>cfg.m==='bal'?cfg.n:3;
function starsOk(team){const c={};for(const id of team){const s=RBY[id].stars;if(s>=3){if(c[s])return false;c[s]=1}}return true}
function teamOk(team,cfg){return team.length===teamSize(cfg)&&(cfg.m!=='bal'||starsOk(team))}
const BAL_RULE='No time cabe no máximo 1 personagem de 5★, 1 de 4★ e 1 de 3★. De 2★ e 1★ pode ter mais de um.';
function rosterNote(){
  const n=distinctChars(),w=n>1?'personagens':'personagem';
  if(n>=NEED3)return '';
  if(n>=NEED2)return `<p class="note">O jogo tem ${n} ${w}. Já dá pra jogar com 2 jogadores. Pra 3 jogadores, são precisos ${NEED3}, porque cada personagem aparece uma vez por partida.</p>`;
  return `<p class="note">O jogo tem ${n} ${w} por enquanto. Cada personagem aparece uma vez por partida, então são precisos pelo menos ${NEED2} pra 2 jogadores e ${NEED3} pra 3.</p>`;
}
const RULES_HTML=`<p>Todo personagem começa com 2000 de vida. Cada jogador joga na sua vez, sempre na mesma ordem, e na sua vez até 2 dos seus personagens agem.</p>
    <p>Cada personagem que age pode usar 1 ataque e mais 1 técnica. A técnica vale na hora, então dá pra ativar e já atacar com ela no mesmo turno. O turno em que ela foi ativada conta na duração.</p>
    <p>O counter não é usado na sua vez. Quando um personagem seu é atacado, você escolhe na hora se usa um counter pra se defender. Cada personagem tem 1 técnica ou 1 counter por rodada, nunca os dois.</p>
    <p>Quando um personagem volta a agir depois de ficar parado, ele fica resistente até o fim da próxima vez dele e não pode ficar sem agir de novo nesse tempo. A resistência é só contra ficar sem agir: ele continua levando dano normalmente.</p>

   Fica no perfil (mv:prof.ul = {g: partidas contadas, ids: [liberados], pend: {0: qualquer estrela, 3:n, 4:n, 5:n}}); depois pode ir pro Supabase.

function unlockGame(p){const u=ulOf(p);u.g++;const want=u.g%3===0?5:u.g%2===0?4:3,order=[want,...[5,4,3].filter(x=>x!==want).sort((a,b)=>Math.abs(a-want)-Math.abs(b-want)||b-a)];

/* ---------- roster (display only) ---------- */
const norm=x=>String(x).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const charNo=id=>CHARS.findIndex(c=>c.i===id)+1;
// Coleção (11/11/2026): mesmo visual da escolha de personagem. Miniaturas à esquerda (busca e agrupar por ordem, universo ou estrelas),
// o personagem grande à direita com a apresentação e as habilidades.
function renderRoster(){
  normalMode();
  app.screen='roster';app.rg=app.rg||'ordem';
  const all=CHARS.filter(c=>!c.hidden);
  if(!app.rsel||!RBY[app.rsel])app.rsel=all[0].i;
  view.innerHTML=psShell('Coleção','<button class="ps-btn" id="back">Voltar</button>',`<span class="ps-sub">${all.length} personagens</span>`,
    `<section class="ps-col"><div class="ps-h">Personagens <span class="ps-sub" id="rcount" style="margin:0 0 0 auto;text-transform:none;letter-spacing:0"></span></div>
      <div class="ps-tools"><input id="rq" type="search" placeholder="Buscar por nome ou universo" autocomplete="off" value="${esc(app.rq||'')}" aria-label="Buscar personagem">
        <div class="ps-filt" id="rgrp" role="group" aria-label="Organizar por">${[['ordem','Ordem'],['universo','Universo'],['estrelas','Estrelas']].map(([k,n])=>`<button data-g="${k}" aria-pressed="${app.rg===k}">${n}</button>`).join('')}</div></div>
      <div class="ps-grid" id="rlist"></div></section>
    <section class="ps-col" id="info"></section>`,'','ps-pick');
  $('#back').onclick=renderHome;
  $('#rq').oninput=e=>{app.rq=e.target.value;renderRosterList()};
  $('#rgrp').onclick=e=>{const b=e.target.closest('[data-g]');if(!b)return;app.rg=b.dataset.g;$('#rgrp').querySelectorAll('[data-g]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));renderRosterList()};
  $('#rlist').onclick=e=>{const c=e.target.closest('.ps-th');if(!c)return;renderChar(c.dataset.id);if(window.matchMedia('(max-width:760px)').matches)$('#info').scrollIntoView({behavior:'smooth',block:'start'})};
  renderRosterList();renderChar(app.rsel);
}
function renderRosterList(){
  const q=norm(app.rq||'').trim();
  const all=CHARS.map((c,i)=>({c,no:i+1})).filter(x=>!x.c.hidden),list=all.filter(x=>!q||norm(x.c.n).includes(q)||norm(x.c.u).includes(q));
  const th=x=>`<button class="ps-th${x.c.soon||isLocked(x.c.i)?' off':''}${x.c.i===app.rsel?' cur':''}" data-id="${esc(x.c.i)}" title="${esc(x.c.n)}" aria-label="${esc(x.c.n)}">${charArt(x.c.i)}<span class="st">${'★'.repeat(x.c.stars||0)}</span><span class="no">${x.no}</span><span class="nm">${esc(sname(x.c.i))}</span>${x.c.soon?'<span class="tk" style="color:#cfc7f0">Em breve</span>':isLocked(x.c.i)?'<span class="lk">🔒</span>':''}</button>`;
  let groups;
  // Universo: os que têm 1 personagem só (contando a coleção inteira, não só a busca) vão juntos pro grupo "Outros", no fim.
  if(app.rg==='universo'){const cnt={};all.forEach(x=>{cnt[x.c.u]=(cnt[x.c.u]||0)+1});const m=new Map(),oth=[];list.forEach(x=>{if(cnt[x.c.u]<2){oth.push(x);return}if(!m.has(x.c.u))m.set(x.c.u,[]);m.get(x.c.u).push(x)});groups=[...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'pt')).map(([t,items])=>({t:esc(t),items}));if(oth.length)groups.push({t:'Outros',items:oth})}
  else if(app.rg==='estrelas'){const m=new Map();list.forEach(x=>{const k=x.c.stars||0;if(!m.has(k))m.set(k,[]);m.get(k).push(x)});groups=[...m.entries()].sort((a,b)=>b[0]-a[0]).map(([k,items])=>({t:`${'★'.repeat(k)} ${k} estrela${k>1?'s':''}`,items}))}
  else groups=[{t:'',items:list}];
  $('#rcount').textContent=q?`${list.length} de ${all.length}`:`${all.length}`;
  $('#rlist').innerHTML=list.length?groups.map(g=>`${g.t?`<div class="gt">${g.t} <span>(${g.items.length})</span></div>`:''}${g.items.map(th).join('')}`).join(''):'<p class="ps-sub gt">Nenhum personagem encontrado.</p>';
}
function renderChar(id){
  const c=RBY[id],info=$('#info');if(!c)return;
  if(app.screen!=='roster'||!info){app.rsel=id;return renderRoster()}
  app.rsel=id;
  document.querySelectorAll('#rlist .ps-th').forEach(t=>t.classList.toggle('cur',t.dataset.id===id));
  info.dataset.id=id;info.innerHTML=psCharHTML(id);psSprite(id);
  const tag=c.soon?'Em breve: ainda não dá pra escolher nas partidas.':isLocked(id)?'Bloqueado: jogue partidas online pra liberar.':'';
  $('#pact').innerHTML=tag?`<span class="ps-sub">${tag}</span>`:'';$('#pact').hidden=!tag;
}

/* ---------- team picker ---------- */
// Moldura das telas antes da batalha: fundo de uma arena escurecido, barra de cima, conteúdo e barra de baixo.
function psShell(title,left,right,main,bot,cls){
  if(app.psBg==null)app.psBg=Math.floor(Math.random()*BATTLE_BGS.length);
  return `<div class="ps"><div class="ps-bg" style="background-image:url(${BATTLE_BGS[app.psBg]})"></div><header class="ps-top">${left||''}<div class="ps-ttl">${title}</div>${right||''}</header><main class="ps-main ${cls||''}">${main}</main>${bot?`<footer class="ps-bot">${bot}</footer>`:''}</div>`;
}
function pickerHTML(label,backId,sub){
  const cfg=pickCfg(),n=teamSize(cfg);
  return psShell(`Escolha ${n} personagens`,`<button class="ps-btn" id="${backId}">Voltar</button>`,sub?`<span class="ps-sub">${sub}</span>`:'',
    `<section class="ps-col"><div class="ps-h">Personagens <span class="ps-sub" id="pcount" style="margin:0 0 0 auto;text-transform:none;letter-spacing:0"></span></div>
      ${cfg.m==='bal'?`<p class="ps-sub">Balanceado: ${BAL_RULE}</p>`:''}
      <div class="ps-filt" id="pfilt" role="group" aria-label="Filtrar por estrelas">${[0,5,4,3,2,1].map(s=>`<button data-s="${s}" aria-pressed="${(app.pf||0)===s}">${s?s+'★':'Todos'}</button>`).join('')}</div>
      <div class="ps-grid" id="grid"></div></section>
    <section class="ps-col" id="info"></section>`,
    `<div class="ps-slots" id="slots"></div><span class="ps-sub" id="phint"></span><button class="ps-btn gold big" id="confirm" data-label="${esc(label)}">${esc(label)}</button>`,'ps-pick');
}
// Por que não dá pra pôr este personagem no time agora ('' = dá).
function addWhy(id){
  const cfg=pickCfg(),tk=takenMap(),twin=teamSel.find(x=>grpOf(x)===grpOf(id));
  if(isLocked(id))return 'Bloqueado. Jogue partidas online pra liberar.';
  if(tk[id])return `Já está no time de ${tk[id]}.`;
  if(twin)return `É o mesmo personagem de ${RBY[twin].n}.`;
  if(teamSel.length>=teamSize(cfg))return 'Time completo. Tire alguém embaixo pra trocar.';
  if(cfg.m==='bal'&&!starsOk([...teamSel,id]))return `Já tem um personagem de ${RBY[id].stars}★ no time.`;
  return '';
}
function togglePick(id){const k=teamSel.indexOf(id);if(k>=0)teamSel.splice(k,1);else if(!addWhy(id))teamSel.push(id);teamInfo=id;updatePicker()}
// Personagem grande (arte ao fundo, sprite na frente, nome e estrelas) + espaço de ações (#pact) + apresentação e habilidades.
function psCharHTML(id,tag){
  const c=RBY[id],art=iconUrl(id),no=charNo(id);
  return `<div class="ps-show">${art?`<div class="ps-art" style="background-image:url(${art})"></div>`:`<div class="ps-art">${charArt(id)}</div>`}<div class="ps-floor"></div><div class="ps-spr" id="pspr"><i></i></div>
    <div class="ps-plate">${tag||''}<div class="n">${esc(c.n)}</div><div class="u">${c.hidden?'Transformação':`Nº ${no}`} · ${esc(c.u)} · ${c.hp} de vida</div>${starsOf(c.stars)}</div></div>
    <div class="ps-act" id="pact"></div>
    <div class="ps-desc">${BIO[id]?`<p class="bio">${esc(BIO[id])}</p>`:''}<div class="ps-h">Habilidades</div><div class="ps-sk">${c.sk.map(k=>`<div class="r" style="--kc:${KIND[k.kind].c}"><b>${esc(k.n)}</b><small>${KIND[k.kind].n}${(k.tags||[]).includes('fisica')?' · físico':''}${(k.tags||[]).includes('magica')?' · mágico':''}${k.passive?' · passiva':''}</small><p>${esc(k.d||'')}</p><p class="m">${skillMeta(k)}</p></div>`).join('')}</div></div>`;
}
// Sprite parado, grande, na frente da arte do personagem (estilo tela de seleção de jogo de luta).
let psIv=null;
function psSprite(id){
  clearInterval(psIv);psIv=null;
  const box=$('#pspr'),d=SPRITES[id];if(!box||!d||!d.a||!d.a.idle)return;
  const show=box.closest('.ps-show'),i=box.querySelector('i'),fr=d.a.idle;let f=0;
  const probe=new Image();probe.onerror=()=>{clearInterval(psIv);psIv=null;box.hidden=true};probe.src=d.src;
  const paint=()=>{if(!document.body.contains(i)){clearInterval(psIv);psIv=null;return}box.style.setProperty('--u',(show.clientHeight*.7/SPR_H)+'px');const q=fr[f%fr.length];sprPaint(i,d.src,d.W,d.H,q[0],q[1],q[2],q[3],q[4],q[5],SPR_H/d.ref);f++};
  paint();if(!reduceMotion)psIv=setInterval(paint,SPR_T.idle[0]);
}
function takenMap(){
  if(app.mode!=='online'||!NET.me)return {};
  const m={};
  const cfg=curCfg();
  for(const o of NET.os)if(o.game===NET.me.game&&teamOk(o.team,cfg)&&byAt(o,meAsPeer())<0)o.team.forEach(id=>{CHARS.forEach(c=>{if(grpOf(c.i)===grpOf(id))m[c.i]=o.nick})});
  return m;
}
function renderPickerGrid(){
  const grid=$('#grid');if(!grid)return;
  const tk=takenMap(),cfg=pickCfg(),n=teamSize(cfg),keep=[];
  for(const id of teamSel){if(!pickable(id)||isLocked(id)||tk[id]||keep.length>=n||keep.some(x=>grpOf(x)===grpOf(id)))continue;if(cfg.m==='bal'&&!starsOk([...keep,id]))continue;keep.push(id)}
  teamSel=keep;
  const list=CHARS.filter(c=>pickable(c.i)),shown=list.filter(c=>!app.pf||c.stars===app.pf);
  grid.innerHTML=shown.map(c=>`<button class="ps-th" data-id="${esc(c.i)}" title="${esc(c.n)}" aria-label="${esc(c.n)}">${charArt(c.i)}<span class="st">${'★'.repeat(c.stars||0)}</span><span class="nm">${esc(sname(c.i))}</span>${isLocked(c.i)?'<span class="lk">🔒</span>':''}${tk[c.i]?`<span class="tk">Com ${esc(tk[c.i])}</span>`:''}</button>`).join('')||'<p class="ps-sub">Nenhum personagem com essa estrela.</p>';
  const pc=$('#pcount');if(pc)pc.textContent=`${shown.length} de ${list.length}`;
  updatePicker();
}
function mountPicker(onConfirm){
  if(!teamInfo||!RBY[teamInfo]||!pickable(teamInfo))teamInfo=teamSel[0]||(CHARS.find(c=>pickable(c.i)&&!isLocked(c.i))||{}).i||null;
  renderPickerGrid();
  // Toque mostra o personagem à direita; toque duplo (ou o botão Escolher) põe ou tira do time.
  $('#grid').onclick=e=>{const c=e.target.closest('.ps-th');if(!c)return;teamInfo=c.dataset.id;updatePicker()};
  $('#grid').ondblclick=e=>{const c=e.target.closest('.ps-th');if(c)togglePick(c.dataset.id)};
  $('#pfilt').onclick=e=>{const b=e.target.closest('[data-s]');if(!b)return;app.pf=+b.dataset.s;$('#pfilt').querySelectorAll('[data-s]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));renderPickerGrid()};
  $('#slots').onclick=e=>{const s=e.target.closest('.ps-slot.full');if(!s)return;teamSel=teamSel.filter(x=>x!==s.dataset.id);teamInfo=s.dataset.id;updatePicker()};
  $('#info').onclick=e=>{if(e.target.closest('#ptog')&&teamInfo)togglePick(teamInfo)};
  $('#confirm').onclick=()=>{if(teamSel.length===teamSize(pickCfg())&&!$('#confirm').disabled)onConfirm(teamSel.slice())};
}
function updatePicker(){
  const slots=$('#slots');if(!slots)return;
  const cfg=pickCfg(),n=teamSize(cfg),tk=takenMap();
  slots.innerHTML=Array.from({length:n},(_,i)=>{const id=teamSel[i];return id
    ?`<button class="ps-slot full" data-id="${esc(id)}" title="Tirar ${esc(RBY[id].n)}" aria-label="Tirar ${esc(RBY[id].n)}">${charArt(id)}</button>`
    :`<div class="ps-slot">${i+1}</div>`}).join('');
  document.querySelectorAll('#grid .ps-th').forEach(c=>{const id=c.dataset.id,k=teamSel.indexOf(id);
    c.classList.toggle('sel',k>=0);c.dataset.n=k>=0?k+1:'';c.classList.toggle('cur',id===teamInfo);c.classList.toggle('off',k<0&&(!!tk[id]||isLocked(id)||!!teamSel.find(x=>grpOf(x)===grpOf(id))||(cfg.m==='bal'&&!starsOk([...teamSel,id]))))});
  const cf=$('#confirm'),extra=app.mode==='cpu'&&distinctChars()<NEED2;
  cf.disabled=teamSel.length!==n||extra;
  cf.textContent=teamSel.length!==n?`Faltam ${n-teamSel.length}`:extra?'Personagens insuficientes':cf.dataset.label;
  const ph=$('#phint');if(ph)ph.textContent=teamSel.length?'Toque num escolhido embaixo pra tirar.':'Toque duas vezes num personagem, ou use Escolher.';
  const info=$('#info'),id=teamInfo&&RBY[teamInfo]?teamInfo:teamSel[0];
  if(!id){info.innerHTML='<p class="ps-sub">Toque num personagem pra ver quem ele é.</p>';return}
  const c=RBY[id],sel=teamSel.includes(id),why=sel?'':addWhy(id),art=iconUrl(id);
  const same=info.dataset.id===id;
  if(!same){
    info.dataset.id=id;info.innerHTML=psCharHTML(id);psSprite(id);
  }
  $('#pact').innerHTML=`<button class="ps-btn ${sel?'':'gold'}" id="ptog" ${!sel&&why?'disabled':''}>${sel?'Tirar do time':'Escolher'}</button><span class="ps-sub">${esc(why)}</span>`;
}

/* ---------- online ---------- */
function renderOnline(prefill){
  normalMode();
  app.screen='online';app.mode=null;app.prefill=prefill||'';
  const nick=myNick();
  let body;
  if(CAP.state==='pending')body='<p class="hint">Conectando…</p>';
  else if(CAP.state!=='ok')body=`<p class="hint">O modo online precisa de internet. Confira a conexão e tente de novo.</p><button class="btn primary" id="toCpu">Treinar</button>`;
  else body=`<label>Seu apelido<input id="nick" maxlength="16" autocomplete="nickname" placeholder="Como os outros vão te ver" value="${esc(nick)}"></label>
    <button class="btn primary big" id="create">Criar sala</button>
    <p class="hint" style="text-align:center">ou entre na sala de alguém</p>
    <div class="row" style="flex-wrap:nowrap"><input id="code" maxlength="4" placeholder="código" autocapitalize="off" autocomplete="off" spellcheck="false" style="flex:1;letter-spacing:6px;font-family:var(--pix);font-size:20px;text-transform:uppercase" value="${esc(app.prefill)}"><button class="btn" id="join">Entrar</button></div>
    <p class="err" id="err" role="alert"></p>`;
  view.innerHTML=psShell('Batalha online','<button class="ps-btn" id="back">Voltar</button>','',`<section class="ps-col ps-narrow"><div class="ps-h">Entrar numa sala</div><div class="stack"><p class="hint">Até 3 jogadores por sala. Quem cria a sala escolhe o modo (Livre ou Balanceado). Se faltar gente, o computador pode completar. Depois de entrar, cada um escolhe o seu time.</p>${body}</div></section>`,'','ps-center');
  $('#back').onclick=()=>{clearHash();renderHome()};
  const tc=$('#toCpu');if(tc)tc.onclick=()=>{app.mode='cpu';teamSel=[];renderPick()};
  const getNick=()=>{const n=cleanText($('#nick').value).slice(0,16);if(!n){$('#err').textContent='Escolha um apelido antes de entrar.';$('#nick').focus();return null}const p=getProf();if(p){p.nick=n;saveProf(p)}else store.set('mv:nick',n);return n};
  const cr=$('#create');if(cr)cr.onclick=()=>{const n=getNick();if(n)joinRoom(genCode(),n,true)};
  const jn=$('#join');
  if(jn){const go=()=>{const n=getNick();if(!n)return;const c=cleanText($('#code').value).toLowerCase();if(!/^[a-z0-9]{4}$/.test(c)){$('#err').textContent='O código tem 4 letras ou números.';return}joinRoom(c,n,false)};jn.onclick=go;$('#code').onkeydown=e=>{if(e.key==='Enter')go()}}
}
function setHash(code){try{history.replaceState(null,'','#sala-'+code)}catch(e){}}
function clearHash(){try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
async function joinRoom(code,nick,creator){
  const err=$('#err');if(err)err.textContent='Entrando…';
  let room;
  try{room=await CAP.room.join('arena-'+code)}catch(e){if($('#err'))$('#err').textContent='Não deu pra entrar na sala agora. Tente de novo em instantes.';return}
  NET.room=room;NET.code=code;NET.peers=[];
  const saved=tabStore.get('arena:sala:'+code);
  NET.me=(saved&&saved.pid)?saved:{pid:rid(),at:Date.now(),host:!!creator,team:[],acts:[],rsp:[],game:0,lineup:null,cfg:{m:'livre',n:3}};
  if(!Array.isArray(NET.me.rsp))NET.me.rsp=[];
  NET.me.cfg=sanCfg(NET.me.cfg);
  NET.me.nick=nick;
  app.mode='online';app.pickOpen=false;
  teamSel=NET.me.team.filter(id=>pickable(id));teamInfo=null;
  setHash(code);pushPresence();
  NET.unsubs.push(room.onPeers(ch=>{NET.peers=ch.peers;syncOnline()},()=>{}));
  NET.unsubs.push(room.onConnection(c=>{NET.conn=c;updateLobby();updateNetInfo()},()=>{}));
  syncOnline(true);
}
function leaveRoom(){
  NET.unsubs.forEach(u=>{try{u()}catch(e){}});NET.unsubs=[];
  try{NET.room&&NET.room.leave()}catch(e){}
  NET.room=null;NET.me=null;NET.code=null;NET.peers=[];M=null;
  clearHash();renderHome();
}
function pushPresence(){
  const m=NET.me;if(!m||!NET.room)return;
  NET.room.presence({app:'arena1',pid:m.pid,nick:m.nick,at:m.at,host:!!m.host,team:m.team,acts:m.acts,rsp:m.rsp||[],game:m.game,lineup:m.lineup||null,cfg:m.cfg||null}).catch(()=>{});
  tabStore.set('arena:sala:'+NET.code,m);

  const stc=sk.kind==='counter'&&/^Só na hora/.test(o.why||'')?'':o.why?(cdm?' st-cd':' st-no'):' st-ok';
  const bdg=cdm?`⏳ ${cdm[1]}`:o.left!=null?`${o.left} ${o.left===1?'USO':'USOS'}`:'';
  return `<button class="b-sk${o.on?' on':''}${o.off?' off':''}${stc}${bdg?' bd':''}" data-k="${k}" ${o.off?'aria-disabled="true"':''} style="--kc:${KIND[sk.kind].c}" title="${esc(sk.d||'')}"><span class="si">${iconSvg(ic,col)}</span><span class="sx"><span class="sn">${esc(sk.n)}</span><span class="ss ${cls}">${esc(st)}</span></span>${bdg?`<span class="bdg">${bdg}</span>`:''}</button>`;
}
function hookSkillHover(el){el.querySelectorAll('.b-sk[data-k]').forEach(b=>{const k=+b.dataset.k;b.onmouseenter=b.onfocus=()=>{if(M.hoverSk!==k){M.hoverSk=k;drawAll()}};b.onmouseleave=b.onblur=()=>{if(M.hoverSk===k){M.hoverSk=null;drawAll()}}})}
// Coluna do meio: habilidades do personagem em foco. Sem ctx, só consulta (fora da sua vez). Com ctx, é a jogada.
function skillsView(ctx){
  const el=$('#pskills');if(!el)return;const v=viewSide();
  if(!ctx){
    const c=focusChar(),id=cid(v,c),d=RBY[id],ch=M.B.sides[v].chars[c];
    el.innerHTML=`<div class="b-h">${iconSvg('swirl','#f2c14e')}Habilidades · ${esc(sname(id))}</div><div class="b-skills" style="${gridCols(d.sk.length)}">${d.sk.map((sk,k)=>{const cd=ch.cd[sk.id]||0,left=sk.charges?ch.ch[chKey(sk)]:null,why=ch.dead?'Fora de combate':cd>0?`Recarga: ${cd} turno${cd>1?'s':''}`:left===0?'Sem usos restantes':'';return skBtn(sk,k,{why,left,ro:1,off:1})}).join('')}</div>`;
    el.querySelectorAll('.b-sk[data-k]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;M.hoverSk=M.hoverSk===k?null:k;drawAll()});
    hookSkillHover(el);return;
  }
  const {P,T,used}=ctx,s=M.mySide,me=M.B.sides[s];
  if(P.sel==null){el.innerHTML=`<div class="b-h">${iconSvg('swirl','#f2c14e')}Habilidades</div><p class="b-sub">${me.chars.some(canAct)?'Toque num personagem seu pra escolher o que ele faz.':'Nenhum dos seus personagens pode agir agora.'}</p>`;setMsg('Sua vez!');return}
  const ch=me.chars[P.sel],d=RBY[ch.id],tch=T.sides[s].chars[P.sel];
  // Bankou: o preso e o Mestre Kame podem se soltar de graça depois dos 2 primeiros turnos, e os dois ficam livres.
  const bk=tch.fx.find(f=>(f.k==='jail'||f.k==='bound')&&f.mutual);
  if(bk){
    const ok=canExit(T,s,P.sel),other=bk.k==='jail'?cname(bk.by[0],bk.by[1]):cname(bk.with[0],bk.with[1]);
    setMsg(`${d.n} está preso no Bankou com ${other}.`);
    el.innerHTML=`<div class="b-h">${iconSvg('swirl','#f2c14e')}Habilidades · ${esc(sname(ch.id))}</div><p class="b-sub">${ok?`${esc(d.n)} pode se soltar de graça e já agir neste turno. ${esc(other)} também fica livre.`:`Ainda não dá pra se soltar: falta${bk.lock>1?'m':''} ${bk.lock} turno${bk.lock>1?'s':''} de ${esc(d.n)}.`}</p>${ok?'<div class="b-row"><button class="b-btn gold" id="exitjail">Se soltar do Bankou</button></div>':''}`;
    if(ok)$('#exitjail').onclick=()=>{P.acts.push({c:P.sel,k:'x',t:[]});renderControls()};return;
  }
  if(isJailed(tch)){
    const jf=tch.fx.find(f=>f.k==='jail');setMsg(`${d.n} está preso na Corrente do Julgamento.`);
    el.innerHTML=`<div class="b-h">${iconSvg('swirl','#f2c14e')}Habilidades · ${esc(sname(ch.id))}</div><p class="b-sub">Pra soltar, ${esc(d.n)} leva ${jf.exitDmg} de dano e já pode agir neste turno. Se esperar, ele continua preso, e quem prendeu também não age.</p><div class="b-row"><button class="b-btn gold" id="exitjail">Sair da corrente (−${jf.exitDmg} de vida)</button></div>`;
    $('#exitjail').onclick=()=>{P.acts.push({c:P.sel,k:'x',t:[]});renderControls()};return;
  }
  let foot='';
  // Controle (Marionete, Axii): 2º passo escolhe o ataque do controlado; 3º passo escolhe as vítimas no time dele.
  if(P.pick!=null&&P.cstage){
    const cs=P.cstage,tid=cid(cs.t[0][0],cs.t[0][1]),td=RBY[tid],tch=T.sides[cs.t[0][0]].chars[cs.t[0][1]],sk=d.sk[P.pick];
    if(cs.k==null){
      if(sk.copy){
        // Imitação de Prefeito: 2º passo escolhe a habilidade do inimigo (ataque ou técnica que dá pra copiar).
        setMsg(`Qual habilidade de ${td.n} ${d.n} vai imitar?`);P.valid=[];
        el.innerHTML=`<div class="b-h">${esc(sk.n)} · ${esc(sname(tid))}</div><div class="b-skills" style="${gridCols(td.sk.length)}">${td.sk.map((k2,i2)=>{const why=copyable(k2)?'':k2.kind==='counter'?'Counter não dá pra imitar':'Não dá pra imitar';return skBtn(k2,i2,{why,left:null,off:!!why})}).join('')}</div><div class="b-row"><button class="b-btn" id="tgcancel">Cancelar</button></div>`;
        el.querySelectorAll('.b-sk[data-k]').forEach(b=>{if(b.classList.contains('off'))return;b.onclick=()=>{const i2=+b.dataset.k,k2=td.sk[i2];cs.k=i2;
          if(k2.tg==='all'||k2.tg==='self'){P.acts.push({c:P.sel,k:P.pick,t:cs.t.slice(),ctrl:{k:i2,t:[]}});P.pick=null;P.tsel=[];P.cstage=null}renderControls()}});
        $('#tgcancel').onclick=()=>{P.pick=null;P.tsel=[];P.cstage=null;renderControls()};return;
      }
      setMsg(`Qual ataque de ${td.n} ele vai usar no próprio time?`);P.valid=[];
      el.innerHTML=`<div class="b-h">${esc(sk.n)} · ${esc(sname(tid))}</div><div class="b-skills" style="${gridCols(td.sk.length)}">${td.sk.map((k2,i2)=>{const cd=tch.cd[k2.id]||0,left=k2.charges?tch.ch[chKey(k2)]:null,why=k2.kind!=='ataque'||k2.genki?'Não é ataque':cd>0?`Recarga: ${cd} turno${cd>1?'s':''}`:left===0?'Sem usos restantes':k2.req&&!hasBuff(tch,k2.req)?`Precisa de ${skillById(td,k2.req).n} ativa`:'';return skBtn(k2,i2,{why,left,off:!!why})}).join('')}</div><div class="b-row"><button class="b-btn" id="tgcancel">Cancelar</button></div>`;
      el.querySelectorAll('.b-sk[data-k]').forEach(b=>{if(b.classList.contains('off'))return;b.onclick=()=>{const i2=+b.dataset.k,k2=td.sk[i2];cs.k=i2;
        if(k2.tg==='all'){P.acts.push({c:P.sel,k:P.pick,t:cs.t.slice(),ctrl:{k:i2,t:[]}});P.pick=null;P.tsel=[];P.cstage=null}renderControls()}});
    }else{
      const k2=td.sk[cs.k],mt=k2.maxT||1;P.valid=[];
      if(sk.copy){
        // Imitação de Prefeito: 3º passo escolhe os alvos da habilidade copiada (do ponto de vista de quem imita).
        const K=Object.assign({},k2,{req:null,inRoom:0}),mn=K.minT||1;P.valid=targetsFor(T,s,P.sel,K,used);
        setMsg(`Em quem ${d.n} vai usar ${k2.n}?`);
        el.innerHTML=`<div class="b-h">${esc(sk.n)} · ${esc(k2.n)}</div><p class="b-sub">Toque ${mt>1?`em ${mn>1?mt:`até ${mt}`} alvos`:'no alvo'} na arena.${K.tg==='any'?' Escolha 1 inimigo e 1 do seu time.':''}</p><div class="b-row">${mt>1?`<button class="b-btn gold" id="ctok" ${cs.v.length>=mn?'':'disabled'}>Confirmar (${cs.v.length} de ${mt})</button>`:''}<button class="b-btn" id="tgcancel">Cancelar</button></div>`;
        const ok=$('#ctok');if(ok)ok.onclick=()=>{if(cs.v.length<mn)return;P.acts.push({c:P.sel,k:P.pick,t:cs.t.slice(),ctrl:{k:cs.k,t:cs.v.slice()}});P.pick=null;P.tsel=[];P.cstage=null;renderControls()};
        $('#tgcancel').onclick=()=>{P.pick=null;P.tsel=[];P.cstage=null;renderControls()};return;
      }
      T.sides[cs.t[0][0]].chars.forEach((x,i)=>{if(!x.dead)P.valid.push([cs.t[0][0],i])});
      setMsg(`Em quem do time de ${td.n} vai acertar ${k2.n}?`);
      el.innerHTML=`<div class="b-h">${esc(sk.n)} · ${esc(k2.n)}</div><p class="b-sub">Toque ${mt>1?`em até ${mt} personagens`:'num personagem'} do time de ${esc(td.n)} na arena (pode ser ele mesmo).</p><div class="b-row">${mt>1?`<button class="b-btn gold" id="ctok" ${cs.v.length?'':'disabled'}>Confirmar (${cs.v.length} de ${mt})</button>`:''}<button class="b-btn" id="tgcancel">Cancelar</button></div>`;
      const ok=$('#ctok');if(ok)ok.onclick=()=>{if(!cs.v.length)return;P.acts.push({c:P.sel,k:P.pick,t:cs.t.slice(),ctrl:{k:cs.k,t:cs.v.slice()}});P.pick=null;P.tsel=[];P.cstage=null;renderControls()};
    }
    $('#tgcancel').onclick=()=>{P.pick=null;P.tsel=[];P.cstage=null;renderControls()};return;
  }
  if(P.pick!=null){
    const sk=d.sk[P.pick],mt=sk.maxT||1,mn=sk.minT||1,who=sk.tg==='ally'?'aliado':sk.tg==='team'?'personagem do seu time (pode ser ele mesmo)':sk.steal?'inimigo e 1 do seu time':sk.tg==='any'?'personagem, de qualquer time, inclusive ele mesmo':sk.inRoom?'inimigo preso na Room':'inimigo';
    P.valid=targetsFor(T,s,P.sel,sk,used);setMsg(`Em quem ${d.n} vai usar ${sk.n}?`);
    foot=`<div class="b-row"><span class="b-sub">Toque ${mt>1?`em ${mn>1?mt:`até ${mt}`} alvos (${who})`:`num ${who}`} na arena.</span>${mt>1?`<button class="b-btn gold" id="tgok" ${P.tsel.length>=mn?'':'disabled'}>Confirmar (${P.tsel.length} de ${mt})</button>`:''}<button class="b-btn" id="tgcancel">Cancelar</button></div>`;
  }else setMsg(`O que ${d.n} vai fazer?`);
  el.innerHTML=`<div class="b-h">${iconSvg('swirl','#f2c14e')}Habilidades · ${esc(sname(ch.id))}</div><div class="b-skills" style="${gridCols(d.sk.length)}">${d.sk.map((sk,k)=>{const why=skillCheck(T,s,P.sel,k,used),left=sk.charges?T.sides[s].chars[P.sel].ch[chKey(sk)]:null;return skBtn(sk,k,{why,left,on:P.pick===k,off:!!why||(P.pick!=null&&P.pick!==k)})}).join('')}</div>${foot}`;
  el.querySelectorAll('.b-sk[data-k]').forEach(b=>{if(b.classList.contains('off'))return;b.onclick=()=>{const k=+b.dataset.k,sk=d.sk[k];
    if(P.pick===k){P.pick=null;P.tsel=[];renderControls();return}
    if(sk.tg==='all')P.acts.push({c:P.sel,k,t:[]});
    else if(sk.tg!=='self'){const vt=targetsFor(T,s,P.sel,sk,used);if(sk.ctrl||sk.copy){P.pick=k;P.tsel=[];P.cstage=vt.length===1?{t:[vt[0]],k:null,v:[]}:null}else if(vt.length===1)P.acts.push({c:P.sel,k,t:[vt[0]]});else{P.pick=k;P.tsel=[]}}
    else P.acts.push({c:P.sel,k,t:[]});
    M.hoverSk=null;renderControls()}});
  hookSkillHover(el);
  const ok=$('#tgok');if(ok)ok.onclick=()=>{if(P.tsel.length<(d.sk[P.pick].minT||1))return;P.acts.push({c:P.sel,k:P.pick,t:P.tsel.slice()});P.pick=null;P.tsel=[];renderControls()};
  const cc=$('#tgcancel');if(cc)cc.onclick=()=>{P.pick=null;P.tsel=[];renderControls()};
}
// Barra de baixo: contadores, fila do turno (com desfazer) e Encerrar turno.
function bottomPlan(P,used){
  const el=$('#bbot');if(!el)return;const me=M.B.sides[M.mySide];
  const actors=Object.keys(used).filter(c=>used[c].atk||used[c].extra).length,u=P.sel!=null?used[P.sel]:null,na=u?(u.atk?1:0)+(u.extra?1:0)+(u.bonus?1:0):0;
  const q=P.acts.map((a,i)=>{const id=me.chars[a.c].id,sk=a.k==='x'?{n:'Se soltar',tg:'self'}:RBY[id].sk[a.k],cn=a.ctrl&&a.t[0]?RBY[cid(a.t[0][0],a.t[0][1])].sk[a.ctrl.k]:null,tg=(sk.tg==='all'?' → todos':a.t.length?' → '+a.t.map(x=>sname(cid(x[0],x[1]))).join(', '):'')+(cn?` (${cn.short||cn.n}${a.ctrl.t.length?' em '+a.ctrl.t.map(x=>sname(cid(x[0],x[1]))).join(', '):' no time todo'})`:'');
    return `<span class="b-q"><b>${i+1}</b>${esc(sname(id))}: ${esc(sk.short||sk.n)}${esc(tg)}<button data-rm="${i}" aria-label="Desfazer">✕</button></span>`}).join('');
  const s=M.mySide,sid=P.sel!=null?me.chars[P.sel].id:null;
  el.innerHTML=`${turnBox(sid,s,sid?`Turno de ${sname(sid)}`:'Sua vez',M.prompt||'')}<div class="b-stat">${iconSvg('ring','#c58bff')}<span>Ações: <b>${na}/2</b></span></div><div class="b-stat">${iconSvg('ppl','#9fd8ff')}<span>Personagens: <b>${actors}/2</b></span></div><div class="b-queue">${q||'<span class="b-sub">Escolha as ações do turno.</span>'}</div><button class="b-end" id="endturn">${iconSvg('sword','#FFE7A3')}<span>${P.acts.length?'Encerrar turno':'Passar a vez'}</span></button>`;
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{P.acts.splice(+b.dataset.rm,1);P.pick=null;P.tsel=[];P.cstage=null;renderControls()});
  $('#endturn').onclick=()=>{planSim();submitTurn(encodeTurn(P.acts))};
}
function bottomWait(txt){const el=$('#bbot');if(!el)return;const s=M&&M.dturn?M.dturn.s:0,D=M&&M.disp&&M.disp.sides[s],li=D?D.chars.findIndex(ch=>!ch.dead):0,id=M?cid(s,li<0?0:li):null;
  el.innerHTML=`${M?turnBox(id,s,s===M.mySide?'Sua vez':`Vez de ${M.names[s]}`,txt):''}<div class="b-queue"></div><button class="b-end" disabled>${iconSvg('sword','#FFE7A3')}<span>Passar a vez</span></button>`}
// Faixa do turno: retrato, de quem é a vez e o que fazer agora (o texto que antes ficava solto na arena).
function turnBox(id,s,title,sub){return `<div class="b-turn" style="--pc:${PC[s]};--pcd:${PCD[s]}">${id?`<span class="b-face">${portraitSvg(id,s)}</span>`:''}<div><span class="b-tn">${esc(title)}</span><span class="b-tp" id="bprompt">${esc(sub||'')}</span></div></div>`}
function renderEnd(){
  const ov=$('#bov');if(!ov||!M)return;
  if(!ov.hidden&&ov.querySelector('.b-help'))return;
  const w=M.B.winner,me=M.mySide;
  setMsg(msgText({k:'end',w}));
  const title=w===-1?'Empate':me==null?`${esc(M.names[w])} venceu`:w===me?'Vitória!':'Derrota';
  const host=NET.host;let btns;
  if(M.mode==='cpu')btns=`<button class="b-btn gold" id="again">Jogar de novo</button><button class="b-btn" id="menu">Menu</button>`;
  else if(host&&host.isMe)btns=`<button class="b-btn gold" id="again">Nova batalha</button><button class="b-btn" id="menu">Sair da sala</button>`;
  else btns=`<p class="b-sub">Esperando ${esc(host?host.nick:'o anfitrião')} começar outra batalha.</p><button class="b-btn" id="menu">Sair da sala</button>`;
  const ulN=ulPending().length;
  ov.hidden=false;ov.innerHTML=`<div class="b-box"><div class="b-title">${title}</div>${ulN?'<div class="b-row" style="justify-content:center"><button class="b-btn gold" id="ulgo">🔓 Escolher personagem novo</button></div>':''}<div class="b-row" style="justify-content:center">${btns}</div></div>`;
  {const ug=$('#ulgo');if(ug)ug.onclick=()=>showUnlock(()=>{ug.remove()})}
  const a=$('#again');
  if(M.mode==='cpu'){a.onclick=()=>{const t=M.teams[0].slice();M=null;app.mode='cpu';teamSel=t;teamInfo=null;renderPick()};$('#menu').onclick=()=>{M=null;renderHome()}}
  else{if(a)a.onclick=()=>{const me=NET.me;me.game=M.game+1;me.lineup=null;me.acts=[];me.rsp=[];M=null;pushPresence();syncOnline(true)};$('#menu').onclick=leaveRoom}
}

/* ---------- boot ---------- */
(function boot(){
  setTimeout(()=>sbLoad().then(()=>sbRefreshUI()),300); // contas: restaura a sessão e traz o perfil da conta
  const m=/^#sala-([a-z0-9]{4})$/.exec(location.hash||'');
  if(m)renderOnline(m[1]);else renderHome();
})();
</script>
