<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New World RPG</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#ECE8F6; --panel:#FFFFFF; --soft:#F3F0FA; --ink:#1E1B2E; --muted:#5D5776; --line:#1E1B2E; --shadow-c:#1E1B2E;
  --accent:#E2367A; --accent-ink:#FFFFFF; --accent-soft:#FCE1EC;
  --hp-ok:#2FB26A; --hp-mid:#EDB22A; --hp-low:#E0473B; --hp-bg:#E1DDEB;
  --display:"Lilita One","Arial Black",system-ui,sans-serif;
  --body:"M PLUS Rounded 1c",ui-rounded,"Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13111D; --panel:#201D30; --soft:#2A2640; --ink:#F0ECFA; --muted:#ABA4C9; --line:#7C73B8; --shadow-c:#05040A;
    --accent:#FF5C9A; --accent-ink:#1A0A12; --accent-soft:#3D2036;
    --hp-ok:#3DC77B; --hp-mid:#F0BE3C; --hp-low:#F0605A; --hp-bg:#38334F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13111D; --panel:#201D30; --soft:#2A2640; --ink:#F0ECFA; --muted:#ABA4C9; --line:#7C73B8; --shadow-c:#05040A;
  --accent:#FF5C9A; --accent-ink:#1A0A12; --accent-soft:#3D2036;
  --hp-ok:#3DC77B; --hp-mid:#F0BE3C; --hp-low:#F0605A; --hp-bg:#38334F;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:500;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
img,svg{max-width:100%}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;line-height:1.05;letter-spacing:.3px}
h2{font-size:28px}
h3{font-size:22px}
p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:14px;box-shadow:4px 4px 0 var(--shadow-c)}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--muted);font-size:14px}
.err{color:var(--hp-low);font-size:14px;font-weight:700}
.note{background:var(--accent-soft);border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-weight:700;font-size:14.5px}
.btn{font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:var(--soft);border:3px solid var(--line);border-radius:12px;padding:10px 16px;box-shadow:3px 3px 0 var(--shadow-c);cursor:pointer;touch-action:manipulation;transition:transform .06s,box-shadow .06s}
.btn:hover{background:var(--accent-soft)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-c)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--shadow-c)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:disabled{opacity:1;background:var(--soft);color:var(--muted)}
.btn.sm{font-size:14px;padding:6px 12px}
.btn.big{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.4px;padding:12px 20px;width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--soft);border:3px solid var(--line);border-radius:10px;padding:8px 11px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
label{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:15px}
label.inline{flex-direction:row;align-items:center;gap:8px}
.kchip{display:inline-block;padding:0 9px;border-radius:999px;font-size:12.5px;font-weight:800;line-height:1.65;color:#fff;background:var(--kc);border:2px solid #1E1B2E;white-space:nowrap}
.tchip{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;font-weight:800;line-height:1.6;color:var(--ink);background:var(--soft);border:2px solid var(--line);white-space:nowrap}
.stars{color:#E9A90E;letter-spacing:1px;font-size:15px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.4px}
.netinfo{font-size:13px;color:var(--muted);text-align:right}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hp-low);border:2px solid var(--line);margin-right:5px;vertical-align:-1px}
.dot.on{background:var(--hp-ok)}
.pdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--pc);border:2px solid #1E1B2E;flex:none}

/* home */
.hero{overflow:hidden}
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;background:#2E2456;isolation:isolate;border-bottom:3px solid var(--line)}
.scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hf{position:absolute;aspect-ratio:140/176}
.hf svg{display:block;width:100%;height:100%}
.hf.a{left:7%;bottom:6%;width:24%}
.hf.b{right:31%;bottom:16%;width:19%}
.hf.c{right:6%;bottom:5%;width:23%}
.hero .body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:12px}
.title{font-family:var(--display);font-size:clamp(44px,11vw,70px);line-height:.92;letter-spacing:.5px}
.lead{font-size:18px;max-width:38ch}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
@media (min-width:560px){.actions{display:grid;grid-template-columns:1fr 1fr}.actions .wide{grid-column:1/-1}}
.rules p{max-width:62ch}
@media (prefers-reduced-motion:no-preference){
  .hf.a{animation:inL .7s cubic-bezier(.2,.9,.3,1.2) both}
  .hf.b{animation:inR .7s .1s cubic-bezier(.2,.9,.3,1.2) both}
  .hf.c{animation:inR .7s .2s cubic-bezier(.2,.9,.3,1.2) both}
}
@keyframes inL{from{transform:translateX(-160%)}to{transform:none}}
@keyframes inR{from{transform:translateX(260%)}to{transform:none}}

/* roster & picker */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;font:inherit;color:var(--ink);text-align:left;background:var(--soft);border:3px solid var(--line);border-radius:12px;padding:8px 10px 10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.card:hover{background:var(--accent-soft)}
.card[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 3px var(--accent)}
.card:disabled{opacity:.5;cursor:not-allowed}
.card .pic{display:block;width:70px;aspect-ratio:140/176;align-self:center}
.card .pic svg{display:block;width:100%;height:100%}
.card .nm{font-weight:800;font-size:15px;line-height:1.2}
.card .uni{font-size:12.5px;color:var(--muted);line-height:1.25}
.card .taken{font-size:12px;font-weight:800;color:var(--hp-low)}
.card .no{position:absolute;top:6px;left:8px;font-size:11.5px;font-weight:800;color:var(--muted)}
.rtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rtools input{flex:1 1 200px}
.seg{display:flex;border:3px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-weight:800;font-size:14px;padding:7px 12px;background:var(--soft);color:var(--ink);border:0;border-right:2px solid var(--line);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.gtitle{font-size:20px;display:flex;align-items:center;gap:6px}
.card .badge[hidden]{display:none}
.card .badge{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:3px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:14px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{font:inherit;border:3px dashed var(--line);border-radius:12px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;color:var(--muted);background:var(--soft);padding:4px;cursor:pointer;text-align:center;font-weight:700}
.slot.full{border-style:solid;color:var(--ink);background:var(--accent-soft)}
.slot .mini{width:44px;aspect-ratio:140/176}
.mini svg{display:block;width:100%;height:100%}
.sticky{position:sticky;bottom:0;padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 22px);display:flex;flex-direction:column;gap:8px;z-index:4}
.skills{display:flex;flex-direction:column;gap:8px}
.sk{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:start;padding:9px 11px;border-radius:10px;background:var(--soft);border-left:8px solid var(--kc)}
.sk .sn{font-weight:800;font-size:16px}
.sk .tags{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.sk .sd{grid-column:1/-1;font-size:14px;color:var(--muted)}
.sk .sm{grid-column:1/-1;font-size:13px;font-weight:800}
.detail{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:start}
.detail .big{width:140px;aspect-ratio:140/176;background:var(--soft);border:3px solid var(--line);border-radius:12px;padding:6px}
.detail .big svg{display:block;width:100%;height:100%}
@media (max-width:480px){.detail{grid-template-columns:1fr}.detail .big{width:150px;justify-self:center}}

/* lobby */
.room{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px}
.room .code{font-family:var(--display);font-size:36px;letter-spacing:5px;line-height:1}
.room .roomhint{flex:1 1 220px;font-size:13.5px;color:var(--muted)}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:10px;background:var(--soft);font-weight:700;font-size:15px}
.prow .st{margin-left:auto;font-size:13px;color:var(--muted)}
.prow .st.ok{color:var(--hp-ok)}
.prow .st.bad{color:var(--hp-low)}

.wait{color:var(--muted);text-align:center;padding:10px;font-weight:700}
/* ---------- menu inicial: imagem com os botões desenhados ---------- */
body.menu-on{overflow:hidden;background:#0a0618}
body.menu-on .wrap{max-width:none;padding:0}
.mn{position:fixed;inset:0;display:grid;place-items:center;background:#0a0618;overflow:hidden}
.mn-stage{position:relative;width:min(100vw,calc(100vh*1671/941));aspect-ratio:1671/941;container-type:inline-size}
.mn-img{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.mn-hit{position:absolute;padding:0;margin:0;border:0;background:transparent;border-radius:1.2cqw;cursor:pointer;transition:box-shadow .15s,background-color .15s;-webkit-tap-highlight-color:transparent}
.mn-hit:hover,.mn-hit:focus-visible{background:rgba(255,255,255,.08);box-shadow:0 0 0 .25cqw rgba(255,236,170,.9),0 0 2.4cqw rgba(255,200,90,.7);outline:none}
.mn-hit:active{background:rgba(255,255,255,.16)}
.mn-hit .lb{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mn-stage.noimg{background:radial-gradient(ellipse at 50% 40%,#3a1f7a,#0a0618 70%)}
.mn-stage.noimg::before{content:'NEW WORLD RPG';position:absolute;left:0;right:0;top:36%;text-align:center;font-family:"Pixelify Sans",var(--display);font-weight:700;font-size:7cqw;color:#F7D774;text-shadow:0 .4cqw 0 #7a4a0c}
.mn-stage.noimg .mn-hit{background:linear-gradient(#2a2160,#151034);box-shadow:0 0 0 .25cqw #F2C14E}
.mn-stage.noimg .mn-hit .lb{position:static;width:auto;clip:auto;display:grid;place-items:center;height:100%;font-family:"Pixelify Sans",var(--display);font-weight:700;font-size:2.6cqw;color:#FFE7A3;text-transform:uppercase}
.mn-ov{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:16px;background:rgba(5,4,11,.72)}
.mn-ov[hidden]{display:none}
.mn-box{width:min(100%,680px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:20px 24px;background:linear-gradient(#1a1535,#0e0b20);border:3px solid #F2C14E;border-radius:14px;color:#EDE7FF;font-size:15.5px}
.mn-box h2{font-family:"Pixelify Sans",var(--display);font-weight:700;color:#F7D774;font-size:24px}
.mn-box p{margin:0}
.mn-box .seg{border-color:#4a3f8f}
.mn-box .seg button{background:#1d1844;color:#EDE7FF;border-right-color:#4a3f8f}
.mn-box .seg button[aria-pressed="true"]{background:#F2C14E;color:#2a1a00}
.mn-box #mnclose{align-self:flex-end}
/* ---------- batalha: palco 16:9 (tudo medido em --u = 1% da altura do palco) ---------- */
body.bt-on{overflow:hidden}
body.bt-on .wrap{max-width:none;padding:0}
.bt{--pix:"Pixelify Sans","Lilita One",system-ui,sans-serif;--gold:#F2C14E;--gold2:#FFE7A3;--line:#2d2557;--line2:#4a3f8f;position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#05040b;color:#EDE7FF;font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.bt button{font:inherit;color:inherit}
.bt{--f:var(--u,5.4px)}
.bstage{position:relative;width:var(--sw,calc(var(--u,5.4px)*177.78));height:calc(var(--u,5.4px)*100);display:grid;grid-template-rows:7fr 59fr 26fr 8fr;overflow:hidden;background:#0B0918;font-size:calc(var(--f)*2.1);line-height:1.2}
.b-top{display:flex;align-items:center;gap:calc(var(--u)*1.4);padding:0 calc(var(--u)*1.4);background:linear-gradient(#15112c,#0a0818);border-bottom:calc(var(--u)*.3) solid var(--line);position:relative;z-index:3;min-width:0}
.b-brand{display:flex;flex-direction:column;justify-content:center;min-width:0}
.b-logo{font-family:var(--pix);font-weight:700;font-size:calc(var(--f)*3.3);line-height:1;color:#F7D774;letter-spacing:.04em;white-space:nowrap;text-shadow:0 calc(var(--u)*.3) 0 #7a4a0c,0 0 calc(var(--u)*1.2) rgba(255,190,80,.45)}
.b-net{font-size:calc(var(--f)*1.35);color:#a99fd6;white-space:nowrap}
.b-net .dot{width:calc(var(--u)*1);height:calc(var(--u)*1);border-width:1px}
.b-order{flex:1;display:flex;align-items:center;justify-content:center;gap:calc(var(--u)*.8);min-width:0;padding:calc(var(--u)*.5) calc(var(--u)*1.2);background:rgba(10,8,24,.7);border:calc(var(--u)*.25) solid var(--line);border-radius:calc(var(--u)*.8);box-shadow:inset 0 0 0 calc(var(--u)*.15) rgba(242,193,78,.25)}
.b-round{font-family:var(--pix);font-weight:700;color:var(--gold);font-size:calc(var(--f)*2.4);white-space:nowrap;margin-right:calc(var(--u)*.6)}
.b-arr{color:var(--gold);font-size:calc(var(--f)*1.3);opacity:.8}
.b-chip{display:flex;align-items:center;gap:calc(var(--u)*.6);min-width:0;padding:calc(var(--u)*.3) calc(var(--u)*.9) calc(var(--u)*.3) calc(var(--u)*.3);border:calc(var(--u)*.25) solid var(--pc);border-radius:calc(var(--u)*.7);background:var(--pcd);opacity:.7;transition:opacity .2s,box-shadow .2s}
.b-chip.now{opacity:1;box-shadow:0 0 calc(var(--u)*1.6) var(--pc),inset 0 0 calc(var(--u)*.8) var(--pc)}
.b-chip.out{opacity:.3;filter:grayscale(1)}
.b-chip .b-face{width:calc(var(--u)*3.2);height:calc(var(--u)*3.2)}
.b-cn{font-family:var(--pix);font-weight:700;font-size:calc(var(--f)*1.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--u)*13)}
.b-cs{font-family:var(--pix);font-size:calc(var(--f)*1.35);white-space:nowrap;padding:0 calc(var(--u)*.5);border-radius:calc(var(--u)*.4);background:rgba(0,0,0,.35)}
.b-chip.now .b-cs{background:var(--pc);color:#fff}
.b-tools{display:flex;gap:calc(var(--u)*.7)}
.b-ib{font-family:var(--pix)!important;font-weight:700;font-size:calc(var(--f)*2);min-width:calc(var(--u)*4.6);height:calc(var(--u)*4.6);padding:0 calc(var(--u)*1);background:linear-gradient(#221c4a,#14102e);border:calc(var(--u)*.25) solid var(--line2);border-radius:calc(var(--u)*.7);cursor:pointer;white-space:nowrap}
.b-ib:hover,.b-btn:hover:not(:disabled){border-color:var(--gold)}
.b-face{display:block;flex:none;border-radius:calc(var(--u)*.5);background:#0a0818;overflow:hidden;border:calc(var(--u)*.18) solid var(--pc,#4a3f8f)}
.b-face svg{width:100%;height:100%;display:block}
.b-arena{position:relative;overflow:hidden;background:#0b0820}
.b-arena canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.b-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 70%;display:block;-webkit-user-select:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.b-shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(rgba(6,4,18,.42),rgba(6,4,18,.08) 28%,rgba(6,4,18,0) 55%,rgba(6,4,18,.35))}
.b-arena.quake{animation:quake .4s linear}
@keyframes quake{20%{transform:translate(.4%,-.3%)}40%{transform:translate(-.4%,.3%)}60%{transform:translate(.3%,.2%)}80%{transform:translate(-.2%,-.2%)}}
.b-units{position:absolute;inset:0}
.b-unit{position:absolute;width:calc(var(--u)*13);height:calc(var(--u)*19.6);padding:0;margin:0;border:0;background:none;transform:translate(-50%,-100%) scale(var(--sc));transform-origin:50% 100%;cursor:default;outline:none}
.b-unit:focus-visible .b-base{border-color:#fff}
.b-bar{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;gap:calc(var(--u)*.25);pointer-events:none}
.b-nm{display:flex;align-items:center;gap:calc(var(--u)*.4);font-family:var(--pix);font-weight:700;font-size:calc(var(--f)*1.65);white-space:nowrap;text-shadow:0 calc(var(--u)*.15) 0 #000,0 0 calc(var(--u)*.4) #000;min-width:0}
.b-nmt{overflow:hidden;text-overflow:ellipsis}
.b-tag{flex:none;background:var(--pc);color:#fff;font-size:calc(var(--f)*1.25);padding:0 calc(var(--u)*.35);border-radius:calc(var(--u)*.3);text-shadow:none}
.b-hpn{margin-left:auto;font-size:calc(var(--f)*1.35);color:#fff}
.b-hp{display:block;position:relative;height:calc(var(--u)*1.2);background:#1a1430;border:calc(var(--u)*.18) solid #000;border-radius:calc(var(--u)*.3);overflow:hidden;box-shadow:0 0 0 calc(var(--u)*.12) var(--pc)}
.b-hp i{display:block;height:100%;width:100%;background:linear-gradient(#7dffa8,#22a35a);transition:width .45s ease-out}
.b-hp i.mid{background:linear-gradient(#ffe68a,#d99a12)}
.b-hp i.low{background:linear-gradient(#ff958a,#c9302a)}
.b-ic{display:flex;gap:calc(var(--u)*.2);height:calc(var(--u)*1.7)}
.b-ic span{display:block;height:100%;aspect-ratio:1}
.b-ic svg{width:100%;height:100%;display:block}
.b-body{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*14)}
.b-spr{position:absolute;left:50%;bottom:0;width:calc(var(--u)*11);height:calc(var(--u)*14);transform:translateX(-50%);transform-origin:50% 92%;transition:filter .2s}
.b-pose{display:block;width:100%;height:100%;animation:bob 1.4s steps(2,jump-none) infinite}
.b-pose svg{width:100%;height:100%;display:block}
.b-pose.fl svg{transform:scaleX(-1)}
@keyframes bob{50%{transform:translateY(-2.5%)}}
.b-base{position:absolute;left:50%;bottom:calc(var(--u)*-1.2);width:calc(var(--u)*10.5);height:calc(var(--u)*2.6);transform:translateX(-50%);border-radius:50%;border:calc(var(--u)*.28) solid var(--pc);background:radial-gradient(closest-side,rgba(0,0,0,.55),rgba(0,0,0,.15) 70%,transparent);box-shadow:0 0 calc(var(--u)*1) var(--pc),inset 0 0 calc(var(--u)*.7) var(--pc)}

function evalScore(B0,B1,s){

    const o=B0.sides[j].chars[c];
    if(j===s){
      v-=(o.hp-ch.hp)*.6;if(ch.dead&&!o.dead)v-=500;
      ch.fx.forEach(f=>{if(f.k==='buff'&&!o.fx.some(x=>x.k==='buff'&&x.id===f.id))v+=160});
      if(ch.fx.some(f=>f.k==='bound')&&!o.fx.some(f=>f.k==='bound'))v-=120;
      v+=Math.max(0,ch.fx.filter(f=>f.k==='hot').length-o.fx.filter(f=>f.k==='hot').length)*150;
    }else{
      if(ch.fx.some(f=>f.k==='jail')&&!o.fx.some(f=>f.k==='jail'))v+=380;
      {const cc=x=>RBY[x.id].sk.reduce((a,k)=>k.kind==='counter'&&k.charges?a+(x.ch[chKey(k)]||0):a,0);v+=Math.max(0,cc(o)-cc(ch))*120}
      {const el=x=>(x.fx.find(f=>f.k==='elec')||{left:0}).left;v+=Math.max(0,el(ch)-el(o))*75}
      v+=o.hp-ch.hp;if(ch.dead&&!o.dead)v+=400;

      if(ch.fx.some(f=>f.k==='taunt'&&f.by[0]===s)&&!o.fx.some(f=>f.k==='taunt'&&f.by[0]===s))v+=70;
      o.fx.forEach(f=>{if(ch.dead)return;if(f.k==='buff'&&!ch.fx.some(x=>x.k==='buff'&&x.id===f.id))v+=120});

    if(!canAct(ch))return;
    const d=RBY[ch.id],opts=[];
    d.sk.forEach((sk,k)=>{
      if(sk.kind==='counter')return;
      if(sk.tg==='all')opts.push({c,k,t:[],kind:sk.kind});

        const en=sk.inRoom||sk.req?enemiesOf(B,s).concat(sk.tg==='ally'?targetsFor(B,s,c,sk):[]):targetsFor(B,s,c,sk),mt=sk.maxT||1;

      if(!ok)continue;

    let best=null,bv=0;
    RBY[ch.id].sk.forEach((sk,k)=>{if(sk.kind!=='ataque')return;const a={c,k,t:[bf.vs]},T2=cloneB(T),u2=JSON.parse(JSON.stringify(used));if(doAction(T2,s,a,u2,[],'cpu')){const v=evalScore(T,T2,s);if(v>bv){bv=v;best=a}}});

      conn.on('open',()=>{S.clients.set(conn.peer,{conn,p:null});try{conn.send({t:'peers',list:hubList()})}catch(e){}});
      conn.on('data',d=>{if(d&&d.t==='presence'&&d.p&&typeof d.p==='object'){const c=S.clients.get(conn.peer);if(c){c.p=d.p;hubBroadcast()}}});
      const drop=()=>{if(S.clients.delete(conn.peer))hubBroadcast()};conn.on('close',drop);conn.on('error',drop);
    });

    p.on('open',()=>{if(done||S.closed)return;done=true;asHub(p)});

      if(e&&e.type==='unavailable-id'){const c=new Peer(undefined,{debug:0});S.peer=c;let ok=false;c.on('open',()=>{ok=true;if(!S.closed)asClient(c)});c.on('error',()=>{if(!ok)restart()})}

    onPeers(cb){S.cbP.add(cb);if(S.list.length)emitPeers();return ()=>S.cbP.delete(cb)},
    onConnection(cb){S.cbC.add(cb);try{cb(S.up)}catch(e){}return ()=>S.cbC.delete(cb)},
    leave(){S.closed=true;clearTimeout(S.timer);try{S.hubConn&&S.hubConn.close()}catch(e){}try{S.peer&&S.peer.destroy()}catch(e){}S.cbP.clear();S.cbC.clear()}

}

function setHash(code){try{history.replaceState(null,'','#sala-'+code)}catch(e){}}
function clearHash(){try{if(location.hash)history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
async function joinRoom(code,nick,creator){
  const err=$('#err');if(err)err.textContent='Entrando…';

  NET.me=(saved&&saved.pid)?saved:{pid:rid(),at:Date.now(),host:!!creator,team:[],acts:[],rsp:[],game:0,lineup:null,cfg:{m:'livre',n:3}};

function leaveRoom(){

function pushPresence(){
  const m=NET.me;if(!m||!NET.room)return;
  NET.room.presence({app:'arena1',pid:m.pid,nick:m.nick,at:m.at,host:!!m.host,team:m.team,acts:m.acts,rsp:m.rsp||[],game:m.game,lineup:m.lineup||null,cfg:m.cfg||null}).catch(()=>{});
  tabStore.set('arena:sala:'+NET.code,m);
}
const ACT_RE=/^(-|[0-2]([a-h]([0-2][0-2]){0,3}|x)(\.[0-2]([a-h]([0-2][0-2]){0,3}|x)){0,6})$/;
function sanTeam(t){if(!Array.isArray(t))return [];const seen=new Set(),out=[];for(const id of t){if(typeof id!=='string'||!RBY[id]||seen.has(grpOf(id)))continue;seen.add(grpOf(id));out.push(id);if(out.length===3)break}return out.length>=2?out:[]}
function sanLineup(L){
  if(!L||typeof L!=='object'||!Array.isArray(L.p))return null;
  const cfg=sanCfg(L.cfg);
  const p=L.p.slice(0,3).map(x=>{if(!x||typeof x!=='object')return null;const team=sanTeam(x.team);if(!teamOk(team,cfg))return null;
    return x.cpu?{cpu:1,n:cleanText(x.n).slice(0,16)||'Computador',team}:(typeof x.pid==='string'&&x.pid?{pid:x.pid.slice(0,32),n:cleanText(x.n).slice(0,16)||'Jogador',team}:null)});
  if(p.length<2||p.some(x=>!x))return null;
  const all=p.flatMap(x=>x.team).map(grpOf);if(new Set(all).size!==all.length)return null;
  if(cfg.m==='bal'&&p.length!==cfg.n)return null;
  return {g:Math.max(0,parseInt(L.g)||0),seed:cleanText(L.seed).slice(0,40),cfg,p};
}
function readPeer(p){
  const x=p.presence||{};
  if(x.app!=='arena1'||typeof x.pid!=='string'||!x.pid)return null;
  const acts=Array.isArray(x.acts)?x.acts.slice(0,200).map(a=>typeof a==='string'&&ACT_RE.test(a)?a:'-'):[];
  const rsp=Array.isArray(x.rsp)?x.rsp.slice(0,600).map(a=>typeof a==='string'&&/^(-|[a-h]([0-2][0-2])?)$/.test(a)?a:'-'):[];
  return {pid:x.pid.slice(0,32),nick:cleanText(x.nick).slice(0,16)||'Jogador',at:Number(x.at)||0,host:!!x.host,team:sanTeam(x.team),acts,rsp,game:Math.max(0,parseInt(x.game)||0),lineup:sanLineup(x.lineup),cfg:sanCfg(x.cfg)};
}
function others(){
  const by={};
  for(const p of NET.peers){if(p.sameTab)continue;const r=readPeer(p);if(!r||r.pid===NET.me.pid)continue;if(!by[r.pid]||r.acts.length+r.rsp.length>by[r.pid].acts.length+by[r.pid].rsp.length)by[r.pid]=r}
  return Object.values(by);
}
const byAt=(a,b)=>(a.at-b.at)||(a.pid<b.pid?-1:a.pid>b.pid?1:0);
function meAsPeer(){const m=NET.me;return {pid:m.pid,nick:m.nick,at:m.at,host:!!m.host,team:m.team,acts:m.acts,game:m.game,lineup:m.lineup,cfg:m.cfg,isMe:true}}
function findHost(os){const all=[meAsPeer(),...os];const f=all.filter(x=>x.host).sort(byAt);return f[0]||all.sort(byAt)[0]}
function syncOnline(force){
  if(app.mode!=='online'||!NET.me)return;

function pickFree(used,rng,size,bal){
  size=size||3;let pool=CHARS.map(c=>c.i).filter(id=>!used.has(grpOf(id)));const t=[];
  while(t.length<size&&pool.length){const id=pool.splice(Math.floor(rng()*pool.length),1)[0];if(bal&&!starsOk([...t,id]))continue;t.push(id);used.add(grpOf(id));pool=pool.filter(x=>!used.has(grpOf(x)))}

function startLineup(){

}

function startCpu(team){

  for(let k=0;k<cpus;k++)teams.push(pickFree(used,Math.random));

function createMatch(o){
  const {B,ev}=newBattle(o.teams,o.seed,o.cpu);
  M=Object.assign({q:o.teams.map(()=>[]),R:o.teams.map(()=>[]),evq:ev.slice(),playing:false,plan:null,fast:0,need:null,pend:null,cpuStr:{}},o,{B});

function pump(noPlay){
  if(!M)return;
  for(let g=0;g<400&&M.B.phase!=='over';g++){
    const s=M.B.cur,t=M.B.tc[s],key=s+':'+t;let str=null;
    if(M.cpu[s])str=M.cpuStr[key]||(M.cpuStr[key]=encodeTurn(cpuTurn(M.B,mulberry32(hash32(M.seed+'|cpu|'+s+'|'+t)))));
    else if(M.q[s].length>t)str=M.q[s][t];

    // O turno roda numa cópia. Se alguém precisa decidir um counter, mostra os eventos até ali e espera.
    // Como o motor é determinístico, a próxima tentativa repete esses mesmos eventos no começo.
    const shown=M.pend&&M.pend.key===key?M.pend.shown:0,T=cloneB(M.B);

const PIXC={};
function pixSvg(rows,pal,opt){
  opt=opt||{};if(opt.key&&PIXC[opt.key])return PIXC[opt.key];
  const h=rows.length,w=Math.max(...rows.map(r=>r.length)),O=opt.outline?1:0;
  const at=(x,y)=>y>=0&&y<h&&x>=0&&x<w?(rows[y][x]||'.'):'.';
  let r='';
  for(let y=-O;y<h+O;y++){let run=null,x0=0;const flush=x=>{if(run)r+=`<rect x="${x0+O}" y="${y+O}" width="${x-x0}" height="1" fill="${run}"/>`};
    for(let x=-O;x<=w+O;x++){let col=null;if(x<w+O){const ch=at(x,y);col=ch!=='.'?(pal[ch]||null):null;if(!col&&O&&(at(x-1,y)!=='.'||at(x+1,y)!=='.'||at(x,y-1)!=='.'||at(x,y+1)!=='.'))col=opt.outline}
      if(col!==run){flush(x);run=col;x0=x}}}
  const W=w+2*O,H=h+2*O;
  const s=`<svg viewBox="${opt.vb||`0 0 ${W} ${H}`}" shape-rendering="crispEdges" preserveAspectRatio="${opt.par||'xMidYMax meet'}" aria-hidden="true" focusable="false">${r}</svg>`;
  if(opt.key)PIXC[opt.key]=s;return s;
}

  let next=-1;for(let i=1;i<n;i++){const j=(cur+i)%n;if(!D.sides[j].out){next=j;break}}
  const chips=M.teams.map((t,s)=>{const out=D.sides[s].out,st=out?'FORA':s===cur?(s===M.mySide?'SUA VEZ':'VEZ'):s===next?'PRÓXIMO':'DEPOIS';const li=D.sides[s].chars.findIndex(ch=>!ch.dead),lead=t[li<0?0:li];
    return `<div class="b-chip${s===cur&&!out?' now':''}${out?' out':''}" style="--pc:${PC[s]};--pcd:${PCD[s]}"><span class="b-face">${portraitSvg(lead,s)}</span><span class="b-cn">J${s+1} · ${esc(M.names[s])}</span><span class="b-cs">${st}</span></div>`});

// Personagem seu em foco no painel (o escolhido pra jogar, o último tocado, ou o primeiro de pé).
function focusChar(){const v=viewSide(),P=planning()?M.plan:null;if(P&&P.sel!=null)return P.sel;if(M.insp&&M.insp[0]===v)return M.insp[1];const i=M.disp.sides[v].chars.findIndex(ch=>!ch.dead);return i<0?0:i}
function previewTargets(P){
  if(!P||P.pick!=null||M.hoverSk==null||P.sel==null||!M.planT)return null;
  const sk=RBY[M.B.sides[M.mySide].chars[P.sel].id].sk[M.hoverSk];if(!sk)return null;
  return sk.tg==='self'?[[M.mySide,P.sel]]:targetsFor(M.planT.T,M.mySide,P.sel,sk,M.planT.used);

function drawAll(){
  if(!M||!$('#bunits'))return;
  const D=M.disp,P=planning()?M.plan:null,prev=previewTargets(P);
  drawTop();
  D.sides.forEach((sd,s)=>sd.chars.forEach((ch,c)=>{
    const el=$(`#fs-${s}-${c}`);if(!el)return;
    const pct=Math.max(0,Math.min(100,ch.hp/ch.max*100)),bar=el.querySelector('.b-hp i');bar.style.width=pct+'%';bar.className=hpCls(pct);

    const au=ch.dead?'':auraOf(ch.fx);el.classList.toggle('aura',!!au);if(au)el.style.setProperty('--aura',au);
    el.classList.toggle('dead',ch.dead);if(!ch.dead)el.classList.remove('dying');
    const has=arr=>(arr||[]).some(x=>x[0]===s&&x[1]===c);
    let mine=false,sel=false,tgt=false,chosen=false,pv=false,n=0;
    if(P){
      if(s===M.mySide){const lc=M.B.sides[s].chars[c];mine=(canAct(lc)||isJailed(lc))&&P.pick==null;sel=P.sel===c;n=P.acts.filter(a=>a.c===c).length}
      if(P.pick!=null){tgt=has(P.valid);chosen=has(P.tsel)}else pv=has(prev);
    }
    el.classList.toggle('mine',mine);el.classList.toggle('sel',sel);el.classList.toggle('tgt',tgt&&!chosen);el.classList.toggle('chosen',chosen);el.classList.toggle('prev',pv);
    el.classList.toggle('insp',!!M.insp&&M.insp[0]===s&&M.insp[1]===c);
    const pl=el.querySelector('.b-pl');pl.textContent=n?`${n}/2`:'';pl.hidden=!n;
    el.tabIndex=tgt||mine?0:-1;

function drawTeam(){

/* --- efeitos visuais (só tela; não mexem no motor) --- */
function uBox(s,c,part){const ar=$('#arena'),el=$(`#fs-${s}-${c}`);if(!ar||!el)return null;const a=ar.getBoundingClientRect(),b=(el.querySelector(part||'.b-spr')||el).getBoundingClientRect();return {x:b.left-a.left+b.width/2,y:b.top-a.top+b.height/2,w:b.width,h:b.height,top:b.top-a.top}}
function fxEl(cls,x,y,html){const L=$('#bfx');if(!L)return null;const n=document.createElement('div');n.className=cls;n.style.left=x+'px';n.style.top=y+'px';if(html)n.innerHTML=html;L.appendChild(n);return n}
function floatAt(s,c,text,cls){const p=uBox(s,c,'.b-bar');if(!p)return;const n=fxEl(cls,p.x,p.top);if(!n)return;n.textContent=text;n.style.animationDuration=spd(1000)+'ms';setTimeout(()=>n.remove(),spd(1050))}
function castFx(s,c,col){const p=uBox(s,c);if(!p)return;const b=fxEl('b-cast',p.x,p.y+p.h*.38);if(!b)return;b.style.setProperty('--oc',col);b.style.animationDuration=spd(500)+'ms';setTimeout(()=>b.remove(),spd(520))}
function burstFx(x,y,col){const b=fxEl('b-burst',x,y);if(!b)return;b.style.setProperty('--oc',col);b.style.animationDuration=spd(420)+'ms';setTimeout(()=>b.remove(),spd(450))}
function shieldFx(s,c){const p=uBox(s,c);if(!p)return;const b=fxEl('b-shield',p.x,p.y);if(!b)return;b.style.width=p.w*1.25+'px';b.style.height=p.h*1.05+'px';b.style.animationDuration=spd(600)+'ms';setTimeout(()=>b.remove(),spd(620))}
function healFx(s,c){const p=uBox(s,c);if(!p)return;for(let i=0;i<6;i++){const n=fxEl('b-spark',p.x+(i-2.5)*p.w*.16,p.y+p.h*.2,iconSvg('plus','#6ff59a'));if(!n)continue;n.style.animationDelay=spd(i*60)+'ms';n.style.animationDuration=spd(700)+'ms';setTimeout(()=>n.remove(),spd(1100))}}
function popFx(s,c,ic,col){const p=uBox(s,c);if(!p)return;const n=fxEl('b-pop',p.x,p.y-p.h*.15,iconSvg(ic,col));if(!n)return;n.style.animationDuration=spd(900)+'ms';setTimeout(()=>n.remove(),spd(950))}
function hitFx(s,c,amt){
  const el=$(`#fs-${s}-${c}`);if(el){el.classList.remove('hit');void el.offsetWidth;el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),400)}
  if(amt>=300&&!reduceMotion){const ar=$('#arena');if(ar){ar.classList.remove('quake');void ar.offsetWidth;ar.classList.add('quake');setTimeout(()=>ar.classList.remove('quake'),450)}}
}
const canMove=typeof CSS!=='undefined'&&CSS.supports&&CSS.supports('translate','1px 1px');
function dashFx(s,c,t){return new Promise(res=>{
  const el=$(`#fs-${s}-${c}`),A=uBox(s,c),B=uBox(t[0],t[1]);if(!el||!A||!B||!el.animate||!canMove||reduceMotion){res();return}
  const dx=(B.x-A.x)*.7,dy=(B.y-A.y)*.7,z=el.style.zIndex;el.style.zIndex=120;
  const an=el.animate([{translate:'0 0'},{translate:`${dx}px ${dy}px`,offset:.45},{translate:`${dx}px ${dy}px`,offset:.6},{translate:'0 0'}],{duration:spd(520),easing:'ease-in-out'});
  an.onfinish=()=>{el.style.zIndex=z};setTimeout(res,spd(250));
})}
function shootFx(s,c,t,col){return new Promise(res=>{
  const A=uBox(s,c),B=uBox(t[0],t[1]);if(!A||!B){res();return}
  const o=fxEl('b-orb',A.x,A.y);if(!o||!o.animate||reduceMotion){if(o)o.remove();burstFx(B.x,B.y,col);res();return}
  o.style.setProperty('--oc',col);
  const an=o.animate([{left:A.x+'px',top:A.y+'px'},{left:B.x+'px',top:B.y+'px'}],{duration:spd(340),easing:'ease-in'});
  an.onfinish=()=>{o.remove();burstFx(B.x,B.y,col);res()};

// Animação de quem age: físico avança e volta; mágico conjura e lança; técnica brilha; counter reagindo brilha em verde.
async function actFx(e){
  const u=M.lastUse;if(!$(`#fs-${e.s}-${e.c}`))return;
  if(!u||u.s!==e.s||u.c!==e.c){castFx(e.s,e.c,'#6ff59a');await sleep(spd(250));return}
  const sk=RBY[M.teams[e.s][e.c]].sk[u.si];if(!sk){await sleep(spd(250));return}
  if(sk.kind==='tecnica'){castFx(e.s,e.c,AURA[sk.id]||'#c58bff');await sleep(spd(380));return}
  const tg=(u.tg||[]).filter(x=>!(x[0]===e.s&&x[1]===e.c)),t=sk.tags||[];
  if(t.includes('fisica')&&!t.includes('magica')&&tg.length&&sk.tg!=='all'){await dashFx(e.s,e.c,tg[0]);return}
  const bolt=sk.bolt||sk.electrify;castFx(e.s,e.c,bolt?'#ffe14d':'#8f7dff');
  const col=bolt?'#ffe14d':sk.dot?'#ff6a3d':t.includes('magica')?'#a58bff':'#ffb36b';
  await Promise.all(tg.map(x=>shootFx(e.s,e.c,x,col)));
}
function msgFx(e){

    case 'stun':popFx(e.s,e.c,'lock','#d7d0f5');break;
    case 'jail':popFx(e.s,e.c,'chain','#b9a7ff');break;
    case 'taunt':popFx(e.s,e.c,'target','#33d1ff');break;
    case 'elec':popFx(e.s,e.c,'bolt','#ffe14d');break;
    case 'invuln':case 'invul':popFx(e.s,e.c,'shield','#ffd34d');break;
    case 'immune':popFx(e.s,e.c,'shield','#7fe7ff');break;

let skipFn=null;
function setMsg(t){const el=$('#msg');if(el)el.textContent=t}
function typeMsg(t){
  return new Promise(res=>{
    const el=$('#msg');if(!el||reduceMotion){setMsg(t);return res()}
    let i=0;el.textContent='';
    const iv=setInterval(()=>{i+=2*(app.speed||1);el.textContent=t.slice(0,i);if(i>=t.length){clearInterval(iv);skipFn=null;res()}},16);
    skipFn=()=>{clearInterval(iv);el.textContent=t;skipFn=null;res()};
  });
}
function waitOrTap(ms){return new Promise(res=>{const to=setTimeout(()=>{skipFn=null;res()},ms);skipFn=()=>{clearTimeout(to);skipFn=null;res()}})}
async function showEvent(e,fast){
  switch(e.t){
    case 'msg':{if(e.k==='use')M.lastUse={s:e.s,c:e.c,si:e.si,tg:e.tg||[]};const t=msgText(e);if(fast){setMsg(t);return}msgFx(e);await typeMsg(t);await waitOrTap(spd(420+t.length*8));return}
    case 'turn':M.dturn={s:e.s,round:e.round};drawAll();if(!fast&&e.s===M.mySide){setMsg('Sua vez!');await sleep(spd(350))}return;
    case 'act':if(!fast)await actFx(e);return;
    case 'hit':if(!fast){floatAt(e.s,e.c,'−'+e.amt,e.src==='self'?'b-num self':'b-num');hitFx(e.s,e.c,e.amt);await sleep(spd(380))}return;
    case 'block':if(!fast){shieldFx(e.s,e.c);floatAt(e.s,e.c,'Bloqueado!','b-num block');await sleep(spd(420))}return;
    case 'heal':if(!fast){healFx(e.s,e.c);floatAt(e.s,e.c,'+'+e.amt,'b-num heal');await sleep(spd(380))}return;
    case 'sync':M.disp=e.st;drawAll();return;
    case 'end':return;
  }
}
async function playEvents(){
  if(!M||M.playing)return;
  const mm=M;mm.playing=true;renderControls();
  while(mm.evq.length&&M===mm){const e=mm.evq.shift();const fast=mm.fast>0;if(fast)mm.fast--;await showEvent(e,fast||app.screen!=='battle')}
  mm.playing=false;
  if(M===mm){drawAll();renderControls();if(mm.mode==='online')syncOnline()}
}

/* ---------- planning a turn ---------- */
function planning(){
  if(!M||M.playing||M.evq.length||M.B.phase==='over'||M.mySide==null)return false;
  const s=M.mySide;return M.B.cur===s&&!M.B.sides[s].out&&M.q[s].length===M.B.tc[s];
}
function planSim(){
  const T=cloneB(M.B),used={},ok=[];
  for(const a of M.plan.acts){if(doAction(T,M.mySide,a,used,[]))ok.push(a)}
  M.plan.acts=ok;return {T,used};
}
function onArenaClick(e){
  const b=e.target.closest('.b-unit');if(!b||!M)return;
  const s=+b.dataset.s,c=+b.dataset.c,P=planning()?M.plan:null;
  if(P&&P.pick!=null){
    if(!(P.valid||[]).some(x=>x[0]===s&&x[1]===c))return;
    const sk=RBY[M.B.sides[M.mySide].chars[P.sel].id].sk[P.pick],k=P.tsel.findIndex(x=>x[0]===s&&x[1]===c);
    if(k>=0)P.tsel.splice(k,1);else if(P.tsel.length<(sk.maxT||1))P.tsel.push([s,c]);
    M.insp=[s,c];
    if((sk.maxT||1)===1&&P.tsel.length===1){P.acts.push({c:P.sel,k:P.pick,t:P.tsel.slice()});P.pick=null;P.tsel=[]}
    renderControls();return;
  }
  pickUnit(s,c);
}
// Tocar num personagem (na arena ou na equipe): mostra os dados dele; se for seu e puder agir, passa a ser o escolhido.
function pickUnit(s,c){
  if(!M)return;const P=planning()?M.plan:null;if(P&&P.pick!=null)return;
  M.insp=[s,c];M.hoverSk=null;
  if(P&&s===M.mySide){const lc=M.B.sides[s].chars[c];if(canAct(lc)||isJailed(lc))P.sel=c}
  renderControls();
}
addEventListener('keydown',e=>{if(e.key==='Escape'&&M&&planning()&&M.plan&&M.plan.pick!=null){M.plan.pick=null;M.plan.tsel=[];renderControls()}});
function renderControls(){
  stopNeedTimer();
  if(!M||!$('#pskills'))return;
  const B=M.B,s=M.mySide;M.planT=null;
  if(M.playing){skillsView(null);bottomWait('');drawAll();return}
  if(B.phase==='over'){skillsView(null);bottomWait('Fim da partida');drawAll();renderEnd();return}
  if(s==null){skillsView(null);setMsg(`Assistindo. Vez de ${M.names[B.cur]}.`);bottomWait('Assistindo a partida');drawAll();return}
  if(M.need){renderNeed();drawAll();return}
  if(B.sides[s].out){skillsView(null);setMsg('Você foi eliminado. A luta continua entre os outros.');bottomWait('Você foi eliminado');drawAll();return}
  if(!planning()){
    const away=M.mode==='online'&&M.pids.some((pid,j)=>pid&&j!==s&&!NET.os.some(o=>o.pid===pid));
    skillsView(null);setMsg(`Esperando ${M.names[B.cur]} jogar…`);
    bottomWait(away?'Alguém saiu da sala. A partida continua quando voltar com o mesmo código.':`Vez de ${M.names[B.cur]}`);drawAll();return;
  }
  if(!M.plan||M.plan.turn!==B.tc[s])M.plan={turn:B.tc[s],acts:[],sel:null,pick:null,tsel:[]};
  const P=M.plan,{T,used}=planSim(),me=B.sides[s];M.planT={T,used};
  if(P.sel!=null&&!canAct(me.chars[P.sel])&&!isJailed(me.chars[P.sel]))P.sel=null;
  if(P.sel==null){const first=me.chars.findIndex(ch=>canAct(ch));if(first>=0&&Object.keys(used).length===0)P.sel=first}
  skillsView({P,T,used});
  bottomPlan(P,used);
  drawAll();
}
const gridCols=n=>{const wide=!!document.querySelector('.bt.compact');return `grid-template-columns:repeat(${n>4?(wide?4:3):2},1fr)`};
function skBtn(sk,k,o){
  const [ic,col]=skIcon(sk),uses=o.left!=null?`${o.left} ${o.left===1?'uso':'usos'}`:'';
  const st=o.why||(o.ro?(uses||KIND[sk.kind].n):(uses?`Disponível · ${uses}`:'Disponível'));
  const cls=o.why?(/^Recarga/.test(o.why)?'cd':'no'):'';
  return `<button class="b-sk${o.on?' on':''}${o.off?' off':''}" data-k="${k}" ${o.off?'aria-disabled="true"':''} style="--kc:${KIND[sk.kind].c}" title="${esc(sk.d||'')}"><span class="si">${iconSvg(ic,col)}</span><span class="sx"><span class="sn">${esc(sk.n)}</span><span class="ss ${cls}">${esc(st)}</span></span></button>`;
}
function hookSkillHover(el){el.querySelectorAll('.b-sk[data-k]').forEach(b=>{const k=+b.dataset.k;b.onmouseenter=b.onfocus=()=>{if(M.hoverSk!==k){M.hoverSk=k;drawAll()}};b.onmouseleave=b.onblur=()=>{if(M.hoverSk===k){M.hoverSk=null;drawAll()}}})}
// Coluna do meio: habilidades do personagem em foco. Sem ctx, só consulta (fora da sua vez). Com ctx, é a jogada.
function skillsView(ctx){
  const el=$('#pskills');if(!el)return;const v=viewSide();
  if(!ctx){
    const c=focusChar(),id=M.teams[v][c],d=RBY[id],ch=M.B.sides[v].chars[c];
    el.innerHTML=`<div class="b-h">Habilidades · ${esc(sname(id))}</div><div class="b-skills" style="${gridCols(d.sk.length)}">${d.sk.map((sk,k)=>{const cd=ch.cd[sk.id]||0,left=sk.charges?ch.ch[chKey(sk)]:null,why=ch.dead?'Fora de combate':cd>0?`Recarga: ${cd} turno${cd>1?'s':''}`:left===0?'Sem usos restantes':'';return skBtn(sk,k,{why,left,ro:1,off:1})}).join('')}</div>`;
    el.querySelectorAll('.b-sk[data-k]').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;M.hoverSk=M.hoverSk===k?null:k;drawAll()});
    hookSkillHover(el);return;
  }
  const {P,T,used}=ctx,s=M.mySide,me=M.B.sides[s];
  if(P.sel==null){el.innerHTML=`<div class="b-h">Habilidades</div><p class="b-sub">${me.chars.some(canAct)?'Toque num personagem seu pra escolher o que ele faz.':'Nenhum dos seus personagens pode agir agora.'}</p>`;setMsg('Sua vez!');return}
  const ch=me.chars[P.sel],d=RBY[ch.id],tch=T.sides[s].chars[P.sel];
  if(isJailed(tch)){
    const jf=tch.fx.find(f=>f.k==='jail');setMsg(`${d.n} está preso na Corrente do Julgamento.`);
    el.innerHTML=`<div class="b-h">Habilidades · ${esc(sname(ch.id))}</div><p class="b-sub">Pra soltar, ${esc(d.n)} leva ${jf.exitDmg} de dano e já pode agir neste turno. Se esperar, ele continua preso, e quem prendeu também não age.</p><div class="b-row"><button class="b-btn gold" id="exitjail">Sair da corrente (−${jf.exitDmg} de vida)</button></div>`;
    $('#exitjail').onclick=()=>{P.acts.push({c:P.sel,k:'x',t:[]});renderControls()};return;
  }
  let foot='';
  if(P.pick!=null){
    const sk=d.sk[P.pick],mt=sk.maxT||1,who=sk.tg==='ally'?'aliado':sk.inRoom?'inimigo preso na Room':'inimigo';
    P.valid=targetsFor(T,s,P.sel,sk,used);setMsg(`Em quem ${d.n} vai usar ${sk.n}?`);
    foot=`<div class="b-row"><span class="b-sub">Toque ${mt>1?`em até ${mt} alvos (${who})`:`num ${who}`} na arena.</span>${mt>1?`<button class="b-btn gold" id="tgok" ${P.tsel.length?'':'disabled'}>Confirmar (${P.tsel.length} de ${mt})</button>`:''}<button class="b-btn" id="tgcancel">Cancelar</button></div>`;
  }else setMsg(`O que ${d.n} vai fazer?`);
  el.innerHTML=`<div class="b-h">Habilidades · ${esc(sname(ch.id))}</div><div class="b-skills" style="${gridCols(d.sk.length)}">${d.sk.map((sk,k)=>{const why=skillCheck(T,s,P.sel,k,used),left=sk.charges?T.sides[s].chars[P.sel].ch[chKey(sk)]:null;return skBtn(sk,k,{why,left,on:P.pick===k,off:!!why||(P.pick!=null&&P.pick!==k)})}).join('')}</div>${foot}`;
  el.querySelectorAll('.b-sk[data-k]').forEach(b=>{if(b.classList.contains('off'))return;b.onclick=()=>{const k=+b.dataset.k,sk=d.sk[k];
    if(P.pick===k){P.pick=null;P.tsel=[];renderControls();return}
    if(sk.tg==='all')P.acts.push({c:P.sel,k,t:[]});
    else if(sk.tg!=='self'){const vt=targetsFor(T,s,P.sel,sk,used);if(vt.length===1)P.acts.push({c:P.sel,k,t:[vt[0]]});else{P.pick=k;P.tsel=[]}}
    else P.acts.push({c:P.sel,k,t:[]});
    M.hoverSk=null;renderControls()}});
  hookSkillHover(el);
  const ok=$('#tgok');if(ok)ok.onclick=()=>{if(!P.tsel.length)return;P.acts.push({c:P.sel,k:P.pick,t:P.tsel.slice()});P.pick=null;P.tsel=[];renderControls()};
  const cc=$('#tgcancel');if(cc)cc.onclick=()=>{P.pick=null;P.tsel=[];renderControls()};
}
// Barra de baixo: contadores, fila do turno (com desfazer) e Encerrar turno.
function bottomPlan(P,used){
  const el=$('#bbot');if(!el)return;const me=M.B.sides[M.mySide];
  const actors=Object.keys(used).filter(c=>used[c].atk||used[c].extra).length,u=P.sel!=null?used[P.sel]:null,na=u?(u.atk?1:0)+(u.extra?1:0)+(u.bonus?1:0):0;
  const q=P.acts.map((a,i)=>{const id=me.chars[a.c].id,sk=a.k==='x'?{n:'Sair da corrente',tg:'self'}:RBY[id].sk[a.k],tg=sk.tg==='all'?' → todos':a.t.length?' → '+a.t.map(x=>sname(M.teams[x[0]][x[1]])).join(', '):'';
    return `<span class="b-q"><b>${i+1}</b>${esc(sname(id))}: ${esc(sk.short||sk.n)}${esc(tg)}<button data-rm="${i}" aria-label="Desfazer">✕</button></span>`}).join('');
  el.innerHTML=`<div class="b-stat">${iconSvg('ppl','#9fd8ff')}<span>Personagens: <b>${actors}/2</b></span></div><div class="b-stat">${iconSvg('ring','#c58bff')}<span>Ações${P.sel!=null?` de ${esc(sname(me.chars[P.sel].id))}`:''}: <b>${na}/2</b></span></div><div class="b-queue">${q||'<span class="b-sub">Escolha as ações do turno.</span>'}</div><button class="b-end" id="endturn">${iconSvg('sword','#FFE7A3')}<span>${P.acts.length?'Encerrar turno':'Passar a vez'}</span></button>`;
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{P.acts.splice(+b.dataset.rm,1);P.pick=null;P.tsel=[];renderControls()});
  $('#endturn').onclick=()=>{planSim();submitTurn(encodeTurn(P.acts))};
}
function bottomWait(txt){const el=$('#bbot');if(!el)return;el.innerHTML=`<div class="b-queue">${txt?`<span class="b-sub">${esc(txt)}</span>`:''}</div><button class="b-end" disabled>${iconSvg('sword','#FFE7A3')}<span>Encerrar turno</span></button>`}
function renderEnd(){
  const ov=$('#bov');if(!ov||!M)return;
  if(!ov.hidden&&ov.querySelector('.b-help'))return;
  const w=M.B.winner,me=M.mySide;
  setMsg(msgText({k:'end',w}));
  const title=w===-1?'Empate':me==null?`${esc(M.names[w])} venceu`:w===me?'Vitória!':'Derrota';
  const host=NET.host;let btns;
  if(M.mode==='cpu')btns=`<button class="b-btn gold" id="again">Jogar de novo</button><button class="b-btn" id="menu">Menu</button>`;
  else if(host&&host.isMe)btns=`<button class="b-btn gold" id="again">Nova batalha</button><button class="b-btn" id="menu">Sair da sala</button>`;
  else btns=`<p class="b-sub">Esperando ${esc(host?host.nick:'o anfitrião')} começar outra batalha.</p><button class="b-btn" id="menu">Sair da sala</button>`;
  ov.hidden=false;ov.innerHTML=`<div class="b-box"><div class="b-title">${title}</div><div class="b-row" style="justify-content:center">${btns}</div></div>`;
  const a=$('#again');
  if(M.mode==='cpu'){a.onclick=()=>{const t=M.teams[0].slice();M=null;app.mode='cpu';teamSel=t;teamInfo=null;renderPick()};$('#menu').onclick=()=>{M=null;renderHome()}}
  else{if(a)a.onclick=()=>{const me=NET.me;me.game=M.game+1;me.lineup=null;me.acts=[];me.rsp=[];M=null;pushPresence();syncOnline(true)};$('#menu').onclick=leaveRoom}
}

/* ---------- boot ---------- */
(function boot(){
  const m=/^#sala-([a-z0-9]{4})$/.exec(location.hash||'');
  if(m)renderOnline(m[1]);else renderHome();
})();
</script>
